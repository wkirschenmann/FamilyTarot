<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tarot</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#1b5e3a" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#24714a" media="(prefers-color-scheme: dark)">
  <style>
:root {
  --bg: #f4f6f3; --fg: #1d2420; --muted: #66726b; --card: #fff; --line: #d9dfda;
  --green: #1b5e3a; --green-fg: #fff; --pos: #17703f; --neg: #b3261e; --warn: #b26a00; --hatch: #e6e9e6;
  --radius: 10px;
  color-scheme: light dark; /* native controls (date picker, scrollbars, checkboxes) follow the system setting */
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121714; --fg: #e8ece9; --muted: #98a59d; --card: #1b221e; --line: #2c3631;
    --green: #24714a; --pos: #5fd08e; --neg: #ff8a80; --warn: #ffb74d; --hatch: #262e29;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.4 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
button, input, select { font: inherit; color: inherit; }
header.top { background: var(--green); color: var(--green-fg); padding: 10px 14px; display: flex; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 5; }
header.top h1 { font-size: 1.15rem; margin: 0; flex: 1; }
header.top a, header.top button { color: inherit; }
main { padding: 12px 14px 40px; max-width: 960px; margin: 0 auto; }
h2 { font-size: 1.05rem; margin: 18px 0 8px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; margin-bottom: 10px; }
.card.link { cursor: pointer; }
.muted { color: var(--muted); font-size: .9rem; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row.end { justify-content: flex-end; }
.grow { flex: 1; }
.btn { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 9px 14px; cursor: pointer; min-height: 42px; }
.btn.primary { background: var(--green); border-color: var(--green); color: var(--green-fg); }
.btn.danger { color: var(--neg); }
.btn.small { padding: 4px 10px; min-height: 32px; font-size: .9rem; }
.btn:disabled { opacity: .45; cursor: default; }
.btn[aria-pressed=true] { background: var(--green); color: var(--green-fg); border-color: var(--green); }
.chip { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 12px; cursor: pointer; }
.chip[aria-pressed=true] { background: var(--green); color: var(--green-fg); border-color: var(--green); }
label.field { display: block; margin: 10px 0; }
label.field > span { display: block; font-size: .85rem; color: var(--muted); margin-bottom: 3px; }
input[type=text], input[type=number], input[type=date], select { width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); min-height: 42px; }
.error { background: #fdecea; color: #8a1c14; border: 1px solid #f5c2bd; border-radius: 8px; padding: 8px 10px; margin: 10px 0; }
@media (prefers-color-scheme: dark) { .error { background: #3a1d1a; color: #ffb4ab; border-color: #6b2c25; } }
.info { background: #fff6e0; color: #6b4a00; border: 1px solid #f0d9a0; border-radius: 8px; padding: 8px 10px; margin: 10px 0; font-size: .92rem; }
@media (prefers-color-scheme: dark) { .info { background: #3a3018; color: #ffd98a; border-color: #5e4e22; } }
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.modal { background: var(--bg); width: 100%; max-width: 560px; max-height: 92vh; overflow: auto; border-radius: 16px 16px 0 0; padding: 14px; }
@media (min-width: 700px) { .overlay { align-items: center; } .modal { border-radius: 16px; } }
.modal h3 { margin: 0 0 6px; font-size: 1.1rem; }
.sheet-wrap { overflow: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); max-height: 70vh; }
table.sheet { border-collapse: separate; border-spacing: 0; width: 100%; font-variant-numeric: tabular-nums; }
.sheet th, .sheet td { border-bottom: 1px solid var(--line); padding: 5px 8px; text-align: right; white-space: nowrap; }
.sheet thead th { position: sticky; top: 0; background: var(--card); z-index: 2; font-weight: 600; }
.sheet th.gone { background: repeating-linear-gradient(45deg, var(--hatch) 0 4px, transparent 4px 8px); color: var(--muted); }
.sheet td.label, .sheet th.label { text-align: left; position: sticky; left: 0; background: var(--card); z-index: 1; min-width: 150px; max-width: 220px; white-space: normal; border-right: 1px solid var(--line); }
.sheet thead th.label { z-index: 3; }
.sheet tr.ann td.label { padding-left: 18px; color: var(--muted); }
.sheet tr.tap { cursor: pointer; }
.sheet tr.bad td { background: #fdecea; }
@media (prefers-color-scheme: dark) { .sheet tr.bad td { background: #3a1d1a; } }
.sheet td.out { background: repeating-linear-gradient(45deg, var(--hatch) 0 4px, transparent 4px 8px); }
.sheet td.dead { color: var(--muted); }
.sheet td small { display: block; color: var(--muted); font-size: .72rem; }
.sheet tfoot td { position: sticky; bottom: 0; background: var(--card); font-weight: 700; border-top: 2px solid var(--line); }
.sheet tfoot td.label { z-index: 3; }
.pos { color: var(--pos); } .neg { color: var(--neg); }
.passed td.label { color: var(--muted); font-style: italic; }
.seg { display: flex; gap: 8px; }
.seg .btn { flex: 1; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
table.rules { width: 100%; border-collapse: collapse; font-size: .92rem; }
table.rules th, table.rules td { padding: 4px 4px; text-align: left; }
table.rules input[type=number] { min-height: 34px; padding: 4px 6px; }
details > summary { cursor: pointer; padding: 6px 0; color: var(--muted); }
.footer { text-align: center; color: var(--muted); font-size: .8rem; margin-top: 24px; }
header.top .btn { background: transparent; border-color: rgba(255,255,255,.55); color: #fff; }
.sheet td.label, .sheet th.label { min-width: 128px; max-width: 150px; font-size: .86rem; }
.sheet th, .sheet td { padding: 5px 6px; }

.warn { background: #fff1d6; color: #6b4a00; border: 1px solid #f0c36b; border-radius: 8px; padding: 8px 10px; margin: 10px 0; font-size: .92rem; }
@media (prefers-color-scheme: dark) { .warn { background: #3a2e12; color: #ffd98a; border-color: #6b5420; } }
.warn-mark { color: var(--warn); cursor: help; }

details.card > summary { color: var(--fg); cursor: pointer; padding: 4px 0; }
details.rules-card[open] > summary { margin-bottom: 8px; }

table.stat { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
table.stat td, table.stat th { padding: 5px 6px; text-align: left; }
table.stat td:last-child { text-align: right; }
table.stat.wide td, table.stat.wide th { text-align: right; }
table.stat.wide td:first-child, table.stat.wide th:first-child { text-align: left; }
table.stat tr.sum td { font-weight: 700; border-top: 1px solid var(--line); }
table.stat thead th { font-size: .8rem; color: var(--muted); font-weight: 600; border-bottom: 1px solid var(--line); }
.chip.static { cursor: default; }
.stats-table td.label { min-width: 110px; }
.stats-table tfoot td { font-weight: 700; }

table.stat td, table.stat th { white-space: nowrap; }
table.stat td:first-child { white-space: normal; }
table.stat.wide td, table.stat.wide th { padding: 5px 4px; font-size: .86rem; }
.stats-table th, .stats-table td { padding: 6px 5px; font-size: .88rem; }
.stats-table td.label, .stats-table th.label { min-width: 92px; max-width: 120px; }

.chart-card { margin-top: 12px; }
svg.chart { width: 100%; height: auto; display: block; }
svg.chart .axis { stroke: var(--line); stroke-width: 1; }
svg.chart .axis.zero { stroke: var(--muted); stroke-width: 1; }
svg.chart .tick { fill: var(--muted); font-size: 9px; font-variant-numeric: tabular-nums; }
.legend { margin-top: 6px; gap: 6px; }
.legend .chip { padding: 4px 10px; font-size: .86rem; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
.legend .chip[aria-pressed=true] { background: var(--card); color: var(--fg); }
.legend .chip[aria-pressed=false] { opacity: .5; }

.log-entry { padding: 8px 10px; margin-bottom: 6px; }

.ranking { display: flex; flex-wrap: wrap; gap: 2px 12px; margin-top: 4px; font-size: .9rem; }
.rank { white-space: nowrap; }
  </style>
</head>
<body>
<div id="root"></div>
<script>window.TAROT_BUILD = '__BUILD__';</script>
<script>
  // Replaced at deployment from the repository secrets (see docs/google-cloud.md); a value still of the form __NAME__
  // means "not configured" (local use, or secret not set): the Drive features stay off.
  window.TAROT_CONFIG = { googleClientId: '__GOOGLE_CLIENT_ID__', googleApiKey: '__GOOGLE_API_KEY__', googleAppId: '__GOOGLE_APP_ID__' };
</script>
<script id="engine">
(function (root) {
  'use strict';

  // ---------------------------------------------------------------------------
  // Pure scoring engine: no DOM, no dependency, integers only.
  // Scores are whole points; the only division is the rounding (by 1, 5 or 10).
  // User-facing messages (validation errors, labels) are in French.
  // ---------------------------------------------------------------------------

  const SCHEMA_VERSION = 1;
  const MIN_PLAYERS = 3;
  const MAX_PLAYERS = 7;
  const MAX_POINT_DIFF = 91;

  const CONTRACT_KEYS = ['petite', 'pousse', 'garde', 'gardeSans', 'gardeContre'];
  const ANNOUNCEMENT_KEYS = [
    'petitAuBout', 'handful', 'doubleHandful', 'tripleHandful', 'misere', 'slamUnannounced', 'slamAnnounced',
    'slamFailed',
  ];
  // Announcements that cost the beneficiary's side instead of paying it (an announced slam that fails).
  const PENALTY = { slamFailed: true };
  const LABELS = {
    petite: 'Petite', pousse: 'Pousse', garde: 'Garde', gardeSans: 'Garde sans', gardeContre: 'Garde contre',
    goulasch: 'Goulasch', passed: 'Tour passé',
    petitAuBout: 'Petit au bout', handful: 'Poignée', doubleHandful: 'Double poignée',
    tripleHandful: 'Triple poignée', misere: 'Misère', slamUnannounced: 'Chelem non annoncé',
    slamAnnounced: 'Chelem annoncé', slamFailed: 'Chelem annoncé non réalisé',
  };

  // Oudlers (bouts) held -> points needed to succeed.
  const THRESHOLDS = { 0: 56, 1: 51, 2: 41, 3: 36 };

  let idCounter = 0;
  let idGenerator = () => {
    idCounter += 1;
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8) + idCounter.toString(36);
  };
  function newId() { return idGenerator(); }
  function setIdGenerator(fn) { idGenerator = fn; }

  // ------------------------------- rules -------------------------------------

  const contract = (valid, base, coef) => ({ valid, base, coef });
  const announcement = (valid, base, multiplied, shared, canFail) => ({ valid, base, multiplied, shared, canFail });

  function presetRules() {
    // FFT preset: follows the official FFT rulebook ("Règlement FFT, donnes libres",
    // https://fftarot.fr/assets/documents/ReglementFFT_DonnesLibres.pdf): contracts Prise x1, Garde x2,
    // Garde sans x4, Garde contre x6 on a base of 25; poignées 20/30/40; petit au bout 10 multiplied by the
    // contract; chelem 200/400, announced but failed slam -200; no rounding (to 1). The rulebook has no Pousse and
    // no misère, so both stay disabled.
    const fft = {
      id: 'fft', name: 'FFT', roundTo: 1, roundOn: 'pts', split: { taker: 2, partner: 1 },
      contracts: {
        petite: contract(true, 25, 1), pousse: contract(false, 25, 1), garde: contract(true, 25, 2),
        gardeSans: contract(true, 25, 4), gardeContre: contract(true, 25, 6), goulasch: { valid: false, amount: 40 },
      },
      announcements: {
        petitAuBout: announcement(true, 10, true, true, false),
        handful: announcement(true, 20, false, true, true),
        doubleHandful: announcement(true, 30, false, true, true),
        tripleHandful: announcement(true, 40, false, true, true),
        misere: announcement(false, 0, false, false, false),
        slamUnannounced: announcement(true, 200, false, true, false),
        slamAnnounced: announcement(true, 400, false, true, false),
        slamFailed: announcement(true, 200, false, true, false),
      },
    };
    const oldSchool = {
      id: 'old-school', name: "À l'ancienne", roundTo: 10, roundOn: 'pts', split: { taker: 2, partner: 1 },
      contracts: {
        petite: contract(true, 10, 1), pousse: contract(true, 20, 1), garde: contract(true, 40, 1),
        gardeSans: contract(true, 80, 1), gardeContre: contract(true, 160, 1), goulasch: { valid: false, amount: 40 },
      },
      announcements: {
        petitAuBout: announcement(true, 10, false, false, false),
        handful: announcement(true, 10, false, false, true),
        doubleHandful: announcement(true, 20, false, false, true),
        tripleHandful: announcement(true, 30, false, false, true),
        misere: announcement(true, 10, false, false, false),
        slamUnannounced: announcement(true, 200, false, true, false),
        slamAnnounced: announcement(true, 400, false, true, false),
        slamFailed: announcement(true, 200, false, true, false),
      },
    };
    const custom = {
      id: 'custom', name: 'Personnalisé', roundTo: 1, roundOn: 'pts', split: { taker: 2, partner: 1 },
      contracts: {
        petite: contract(true, 25, 1), pousse: contract(false, 25, 1), garde: contract(true, 25, 2),
        gardeSans: contract(true, 25, 4), gardeContre: contract(true, 25, 6), goulasch: { valid: true, amount: 40 },
      },
      announcements: {
        petitAuBout: announcement(true, 10, true, true, false),
        handful: announcement(true, 20, false, true, true),
        doubleHandful: announcement(true, 30, false, true, true),
        tripleHandful: announcement(true, 40, false, true, true),
        misere: announcement(true, 10, false, false, false),
        slamUnannounced: announcement(true, 200, false, true, false),
        slamAnnounced: announcement(true, 400, false, true, false),
        slamFailed: announcement(true, 200, false, true, false),
      },
    };
    // Until May 2016 the petit au bout was worth a fixed 10 (not multiplied by the contract).
    const custom2016 = JSON.parse(JSON.stringify(custom));
    custom2016.id = 'custom-2016';
    custom2016.name = 'Personnalisé (avant mai 2016)';
    custom2016.announcements.petitAuBout.multiplied = false;
    return [fft, oldSchool, custom, custom2016];
  }

  /** Returns the list of problems found in a rule set (empty when valid). */
  function validateRules(rules) {
    const errors = [];
    if (![1, 5, 10].includes(rules.roundTo)) errors.push("L'arrondi doit être 1, 5 ou 10.");
    if (!['pts', 'base', 'total'].includes(rules.roundOn)) errors.push("L'arrondi porte sur les points, la base ou le total.");
    if (!rules.split || !Number.isInteger(rules.split.taker) || !Number.isInteger(rules.split.partner)
      || rules.split.taker < 0 || rules.split.partner < 0 || rules.split.taker + rules.split.partner !== 3) {
      errors.push('Le partage preneur/partenaire doit totaliser 3 parts entières (2/1 par défaut).');
    }
    if (!CONTRACT_KEYS.some((k) => rules.contracts[k].valid)) errors.push('Il faut au moins un contrat actif.');
    for (const key of CONTRACT_KEYS) {
      const c = rules.contracts[key];
      if (!Number.isInteger(c.base) || !Number.isInteger(c.coef) || c.base < 0 || c.coef < 0) {
        errors.push(`${LABELS[key]} : base et coefficient doivent être des entiers positifs.`);
      }
    }
    if (!Number.isInteger(rules.contracts.goulasch.amount) || rules.contracts.goulasch.amount < 0) {
      errors.push('Goulasch : le montant doit être un entier positif.');
    }
    for (const key of ANNOUNCEMENT_KEYS) {
      if (!Number.isInteger(rules.announcements[key].base) || rules.announcements[key].base < 0) {
        errors.push(`${LABELS[key]} : la base doit être un entier positif.`);
      }
    }
    return errors;
  }

  function canonical(x) {
    if (Array.isArray(x)) return x.map(canonical);
    if (x && typeof x === 'object') {
      const out = {};
      for (const k of Object.keys(x).sort()) out[k] = canonical(x[k]);
      return out;
    }
    return x;
  }

  /** True when two rule sets have the same values (identifiers and names are ignored). */
  function sameRules(a, b) {
    const core = (r) => JSON.stringify(canonical({
      roundTo: r.roundTo, roundOn: r.roundOn, split: r.split, contracts: r.contracts, announcements: r.announcements,
    }));
    return core(a) === core(b);
  }

  const VARIANT_SUFFIX = ' (modifié)';
  function variantName(name) {
    return name.endsWith(VARIANT_SUFFIX) ? name : name + VARIANT_SUFFIX;
  }

  /**
   * Returns the stored rule set having exactly these values, adding it when it does not exist yet.
   * Rule sets are history (games point to them), so a modified set is always a new one, never an edit.
   * Its name is the preset's when the values are a current preset, else the given name + " (modifié)".
   */
  function findOrAddRules(doc, rules) {
    const errors = validateRules(rules);
    if (errors.length) throw new Error(errors.join(' '));
    const existing = doc.rules.find((r) => sameRules(r, rules));
    if (existing) return existing;
    const preset = presetRules().find((p) => sameRules(p, rules));
    const free = (id) => !doc.rules.some((r) => r.id === id);
    const version = Object.assign(JSON.parse(JSON.stringify(rules)), {
      id: preset && free(preset.id) ? preset.id : newId(),
      name: preset ? preset.name : variantName(rules.name || 'Règles'),
    });
    doc.rules.push(version);
    return version;
  }

  function validContracts(rules) {
    return CONTRACT_KEYS.filter((k) => rules.contracts[k].valid);
  }
  function validAnnouncements(rules) {
    return ANNOUNCEMENT_KEYS.filter((k) => rules.announcements[k].valid);
  }
  function goulaschEnabled(rules) { return !!rules.contracts.goulasch.valid; }

  /** Local calendar day as YYYY-MM-DD (toISOString would give the UTC day, wrong around midnight outside UTC). */
  function localDate(date) {
    const pad = (n) => String(n).padStart(2, '0');
    return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
  }

  // ------------------------------ arithmetic ---------------------------------

  /** Round to the nearest multiple of v, halves going up (same as the workbook: Int(x / v + 1/2) * v). */
  function roundTo(x, v) {
    return Math.floor((2 * x + v) / (2 * v)) * v;
  }

  /** Value D paid by each opponent for a contract: (B + E) x C with the rule set's rounding. */
  function contractValue(rules, contractKey, pointDiff) {
    const c = rules.contracts[contractKey];
    const e = pointDiff;
    switch (rules.roundOn) {
      case 'pts': return (c.base + roundTo(e, rules.roundTo)) * c.coef;
      case 'base': return roundTo(c.base + e, rules.roundTo) * c.coef;
      default: return roundTo((c.base + e) * c.coef, rules.roundTo);
    }
  }

  function zeroScores(players) {
    const scores = {};
    for (const p of players) scores[p] = 0;
    return scores;
  }
  function activePlayers(deal) { return deal.players.filter((p) => !deal.dead.includes(p)); }

  // ------------------------------ deal scores --------------------------------

  /** Scores of the contract itself (without announcements): { playerId: points }. */
  function contractScores(rules, deal) {
    const scores = zeroScores(deal.players);
    if (deal.type === 'passed') return scores;
    if (deal.type === 'goulasch') {
      const v = rules.contracts.goulasch.amount;
      scores[deal.winner] = v;
      scores[deal.loser] = -v;
      return scores;
    }
    const d = contractValue(rules, deal.contract, deal.pointDiff);
    const s = deal.succeeded ? 1 : -1;
    const n = deal.players.length;
    const active = activePlayers(deal);
    if (n <= 4) {
      for (const p of active) scores[p] = -s * d;
      scores[deal.taker] = s * d * (n - 1);
      return scores;
    }
    const selfCall = deal.partner === deal.taker;
    for (const p of active) scores[p] = -s * d;
    if (selfCall) {
      scores[deal.taker] = s * d * 4;
    } else {
      scores[deal.taker] = s * d * rules.split.taker;
      scores[deal.partner] = s * d * rules.split.partner;
    }
    return scores;
  }

  /** Scores of one announcement attached to a contract deal. */
  function announcementScores(rules, deal, ann) {
    if (deal.type !== 'contract') throw new Error('Une annonce ne peut être rattachée qu\'à un contrat.');
    const spec = rules.announcements[ann.type];
    const scores = zeroScores(deal.players);
    const n = deal.players.length;
    const active = activePlayers(deal);
    const b = spec.base * (spec.multiplied ? rules.contracts[deal.contract].coef : 1);
    let sign = 1;
    if (spec.canFail && contractScores(rules, deal)[ann.beneficiary] < 0) sign = -1;
    if (PENALTY[ann.type]) sign = -sign;
    const ben = ann.beneficiary;

    if (!spec.shared) {
      for (const p of active) if (p !== ben) { scores[p] = -sign * b; scores[ben] += sign * b; }
      return scores;
    }
    if (n <= 4) {
      if (ben === deal.taker) {
        for (const p of active) if (p !== ben) scores[p] = -sign * b;
        scores[ben] = sign * b * (n - 1);
      } else {
        for (const p of active) if (p !== deal.taker) scores[p] = sign * b;
        scores[deal.taker] = -sign * b * (n - 1);
      }
      return scores;
    }
    const selfCall = deal.partner === deal.taker;
    const team = [deal.taker, deal.partner];
    const opponents = active.filter((p) => !team.includes(p));
    const takerShare = selfCall ? 4 : rules.split.taker;
    const partnerShare = selfCall ? 0 : rules.split.partner;
    if (team.includes(ben)) {
      scores[deal.taker] = sign * b * takerShare;
      if (!selfCall) scores[deal.partner] = sign * b * partnerShare;
      for (const p of opponents) scores[p] = -sign * b;
    } else {
      scores[deal.taker] = -sign * b * takerShare;
      if (!selfCall) scores[deal.partner] = -sign * b * partnerShare;
      for (const p of opponents) scores[p] = sign * b;
    }
    return scores;
  }

  function sumScores(scores) {
    let t = 0;
    for (const k of Object.keys(scores)) t += scores[k];
    return t;
  }

  function rulesFor(doc, game, deal) {
    const id = (deal && deal.rulesId) || game.rulesId;
    const rules = doc.rules.find((r) => r.id === id);
    if (!rules) throw new Error(`Règles introuvables : ${id}`);
    return rules;
  }

  /**
   * Recomputes every stored score of a game (contract + announcements) and returns the sheet rows
   * with running totals. Lines flagged `historical` keep their stored scores.
   */
  function recomputeGame(doc, game) {
    const rows = [];
    const totals = zeroScores(game.tableOrder);
    game.deals.forEach((deal, index) => {
      deal.number = index + 1;
      const rules = rulesFor(doc, game, deal);
      if (!deal.historical) deal.scores = contractScores(rules, deal);
      const lines = [{ deal, ann: null, scores: deal.scores }];
      for (const ann of deal.announcements || []) {
        if (!ann.historical) ann.scores = announcementScores(rules, deal, ann);
        lines.push({ deal, ann, scores: ann.scores });
      }
      for (const line of lines) {
        for (const p of Object.keys(line.scores)) totals[p] = (totals[p] || 0) + line.scores[p];
        rows.push({
          dealId: deal.id,
          annId: line.ann ? line.ann.id : null,
          number: deal.number,
          deal,
          ann: line.ann,
          scores: line.scores,
          cumulative: Object.assign({}, totals),
          balanced: sumScores(line.scores) === 0,
        });
      }
    });
    return { rows, totals };
  }

  /**
   * Running totals after each deal (announcements included), for the evolution chart:
   * { players: [ids], points: [{ deal: number, totals: { id: total } }] } starting with a zero point (deal 0).
   * Passed deals are skipped (they score nothing).
   */
  function evolution(doc, game) {
    const { rows } = recomputeGame(doc, game);
    const last = new Map();
    for (const row of rows) if (row.deal.type !== 'passed') last.set(row.deal.id, row);
    const points = [{ deal: 0, totals: zeroScores(game.tableOrder) }];
    for (const row of last.values()) points.push({ deal: row.number, totals: Object.assign(zeroScores(game.tableOrder), row.cumulative) });
    return { players: game.tableOrder.slice(), points };
  }

  // ------------------------------- dealers -----------------------------------

  function presentPlayers(game) { return game.tableOrder.filter((p) => game.present.includes(p)); }

  /** Next dealer after `dealerId`, following the table order among present players. */
  function nextDealer(game, dealerId) {
    if (!dealerId) return null; // unknown dealer
    const order = game.tableOrder;
    const start = order.indexOf(dealerId);
    for (let i = 1; i <= order.length; i += 1) {
      const candidate = order[(start + i) % order.length];
      if (game.present.includes(candidate)) return candidate;
    }
    return dealerId;
  }

  /** Dealer expected for the next deal appended to the game. */
  function expectedDealer(game) {
    if (!game.deals.length) return presentPlayers(game)[0];
    const last = game.deals[game.deals.length - 1].dealer;
    return last ? nextDealer(game, last) : null; // null: unknown (deals imported from the old workbook have no dealer)
  }

  // ---------------------------- validation -----------------------------------

  /** Validates a deal input; returns a list of French error messages (empty when valid). */
  function validateDeal(rules, deal) {
    const errors = [];
    const n = deal.players.length;
    if (n < MIN_PLAYERS || n > MAX_PLAYERS) errors.push('Une donne se joue de 3 à 7 joueurs.');
    if (new Set(deal.players).size !== n) errors.push('Un joueur est présent plusieurs fois.');
    if (!deal.dealer) errors.push('Choisissez le donneur.');
    else if (!deal.players.includes(deal.dealer)) errors.push('Le donneur doit faire partie des joueurs de la donne.');
    if (deal.type === 'passed') return errors;
    const expectedDead = Math.max(0, n - 5);
    if (deal.dead.length !== expectedDead) {
      errors.push(expectedDead === 0 ? 'Aucun mort à moins de 6 joueurs.'
        : expectedDead === 1 ? 'Il faut indiquer 1 mort à 6 joueurs.' : 'Il faut indiquer 2 morts à 7 joueurs.');
    }
    if (new Set(deal.dead).size !== deal.dead.length) errors.push('Le 2e mort doit être différent du 1er.');
    for (const d of deal.dead) if (!deal.players.includes(d)) errors.push('Un mort ne fait pas partie des joueurs de la donne.');
    const active = deal.players.filter((p) => !deal.dead.includes(p));
    const isActive = (p) => !!p && active.includes(p);

    if (deal.type === 'goulasch') {
      if (!rules.contracts.goulasch.valid && !deal.historical) errors.push("Le Goulasch n'est pas activé dans les règles.");
      if (!deal.winner || !deal.loser) errors.push('Indiquez le gagnant et le perdant.');
      else {
        if (deal.winner === deal.loser) errors.push('Le gagnant et le perdant doivent être différents.');
        if (!isActive(deal.winner) || !isActive(deal.loser)) errors.push('Un mort ne peut être ni gagnant ni perdant du Goulasch.');
      }
      return errors;
    }
    if (deal.type !== 'contract') { errors.push('Type de donne inconnu.'); return errors; }
    if (!CONTRACT_KEYS.includes(deal.contract)) errors.push('Choisissez un contrat.');
    if (!isActive(deal.taker)) errors.push(deal.dead.includes(deal.taker) ? 'Le preneur ne peut pas être mort.' : 'Choisissez le preneur.');
    if (n >= 5) {
      if (!isActive(deal.partner)) errors.push(deal.dead.includes(deal.partner) ? 'Le partenaire ne peut pas être mort.' : 'Choisissez le partenaire.');
    }
    if (typeof deal.succeeded !== 'boolean') errors.push('Indiquez si le contrat est réalisé.');
    if (!Number.isInteger(deal.pointDiff) || deal.pointDiff < 0 || deal.pointDiff > MAX_POINT_DIFF) {
      errors.push(`L'écart de points doit être un entier de 0 à ${MAX_POINT_DIFF}.`);
    }
    return errors;
  }

  function validateAnnouncement(rules, deal, ann) {
    const errors = [];
    if (deal.type !== 'contract') errors.push('Une annonce se rattache à un contrat (pas à un Goulasch ni à un tour passé).');
    if (!ANNOUNCEMENT_KEYS.includes(ann.type)) errors.push("Choisissez le type d'annonce.");
    else if (!rules.announcements[ann.type].valid && !ann.historical) errors.push("Cette annonce n'est pas activée dans les règles.");
    if (!ann.beneficiary || !activePlayers(deal).includes(ann.beneficiary)) {
      errors.push("Le bénéficiaire doit avoir joué la donne (ni mort ni absent).");
    } else if (PENALTY[ann.type] && !attackingTeam(deal).includes(ann.beneficiary)) {
      errors.push('Le chelem a été annoncé par le preneur (ou son partenaire).');
    }
    return errors;
  }

  /** Taker and, from 5 players, partner (no duplicate on a self-call). */
  function attackingTeam(deal) {
    return Array.from(new Set([deal.taker, deal.partner].filter(Boolean)));
  }

  // ----------------------------- assisted entry ------------------------------

  /**
   * From oudlers held and points scored (to the half point), deduces `succeeded` and `pointDiff`.
   * FFT rule: a half point always goes to the winning side. With 2 oudlers (41 needed), 40.5 points make
   * 40 (failed by 1) and 41.5 make 42 (made by 1).
   */
  function assistedResult(oudlers, points) {
    const threshold = THRESHOLDS[oudlers];
    if (threshold === undefined) throw new Error('Nombre de bouts invalide (0 à 3).');
    if (typeof points !== 'number' || !Number.isFinite(points) || points < 0 || points > MAX_POINT_DIFF || !Number.isInteger(points * 2)) {
      throw new Error(`Les points se comptent au demi-point près, de 0 à ${MAX_POINT_DIFF}.`);
    }
    const settled = points >= threshold ? Math.ceil(points) : Math.floor(points);
    const diff = settled - threshold;
    return { succeeded: diff >= 0, pointDiff: Math.abs(diff) };
  }

  // ------------------------------ change log ---------------------------------

  /** One-line description of a deal, for the change log. */
  function dealSummary(doc, deal) {
    const name = (id) => playerName(doc, id);
    if (deal.type === 'passed') return deal.dealer ? `${LABELS.passed} (donneur ${name(deal.dealer)})` : LABELS.passed;
    if (deal.type === 'goulasch') return `${LABELS.goulasch} — ${name(deal.winner)} gagne, ${name(deal.loser)} perd`;
    let who = name(deal.taker);
    if (deal.players.length >= 5 && deal.partner) who += deal.partner === deal.taker ? ' (s’appelle)' : ` + ${name(deal.partner)}`;
    return `${LABELS[deal.contract]} — ${who} · ${deal.succeeded ? 'réalisé de' : 'chuté de'} ${deal.pointDiff}`;
  }

  /**
   * What an action changed in a game, as French sentences (deals added / removed / modified with before -> after,
   * announcements, rules, players at the table, end of game). Used for the change log; renumbering is ignored.
   */
  function describeChange(doc, before, after) {
    const name = (id) => playerName(doc, id);
    const ann = (a) => `${LABELS[a.type]} — ${name(a.beneficiary)}`;
    const texts = [];
    const core = (d) => JSON.stringify([d.type, d.dealer, d.players, d.dead, d.contract, d.taker, d.partner, d.succeeded, d.pointDiff, d.winner, d.loser]);
    const beforeDeals = new Map(before.deals.map((d) => [d.id, d]));
    const afterIds = new Set(after.deals.map((d) => d.id));
    for (const d of before.deals) {
      if (afterIds.has(d.id)) continue;
      const n = (d.announcements || []).length;
      texts.push(`Donne ${d.number} supprimée : ${dealSummary(doc, d)}${n ? ` (avec ${n} annonce${n > 1 ? 's' : ''})` : ''}`);
    }
    for (const d of after.deals) {
      const old = beforeDeals.get(d.id);
      if (!old) { texts.push(d.type === 'passed' ? `${dealSummary(doc, d)} ajouté` : `Donne ${d.number} ajoutée : ${dealSummary(doc, d)}`); continue; }
      if (core(old) !== core(d)) texts.push(`Donne ${d.number} modifiée : ${dealSummary(doc, old)} → ${dealSummary(doc, d)}`);
      const olds = new Map((old.announcements || []).map((a) => [a.id, a]));
      for (const a of d.announcements || []) {
        const o = olds.get(a.id);
        if (!o) texts.push(`Annonce ajoutée à la donne ${d.number} : ${ann(a)}`);
        else if (o.type !== a.type || o.beneficiary !== a.beneficiary) texts.push(`Annonce de la donne ${d.number} modifiée : ${ann(o)} → ${ann(a)}`);
        olds.delete(a.id);
      }
      for (const o of olds.values()) texts.push(`Annonce supprimée de la donne ${d.number} : ${ann(o)}`);
    }
    if (before.rulesId !== after.rulesId) {
      const rn = (id) => (doc.rules.find((r) => r.id === id) || { name: '?' }).name;
      texts.push(`Règles changées : ${rn(before.rulesId)} → ${rn(after.rulesId)}`);
    }
    const joined = after.tableOrder.filter((id) => !before.tableOrder.includes(id));
    if (joined.length) texts.push(`${joined.map(name).join(', ')} rejoint${joined.length > 1 ? 'nt' : ''} la table`);
    const left = before.present.filter((id) => !after.present.includes(id));
    if (left.length) texts.push(`${left.map(name).join(', ')} quitte${left.length > 1 ? 'nt' : ''} la table`);
    const back = after.present.filter((id) => !before.present.includes(id) && before.tableOrder.includes(id));
    if (back.length) texts.push(`${back.map(name).join(', ')} revient${back.length > 1 ? 'nent' : ''} à la table`);
    if (before.date !== after.date) texts.push(`Date de la partie changée : ${before.date} → ${after.date}`);
    if (before.state !== 'archived' && after.state === 'archived') texts.push('Partie terminée');
    if (before.state === 'archived' && after.state !== 'archived') texts.push('Partie rouverte');
    return texts;
  }

  // -------------------------------- exports ----------------------------------

  const yesNo = (v) => (v === true ? 'oui' : v === false ? 'non' : '');

  /** The score sheet of a game as a table (header + rows of strings / numbers), like the old workbook's sheet. */
  function gameTable(doc, game) {
    const name = (id) => playerName(doc, id);
    const ids = game.tableOrder;
    const header = ['N°', 'Donneur', 'Contrat / Annonce', 'Preneur / Annonceur / Gagnant', 'Appelé / Perdant', 'Mort(s)', 'Réalisé ?', 'Écart']
      .concat(ids.map((id) => name(id))).concat(ids.map((id) => `Cumul ${name(id)}`));
    const { rows } = recomputeGame(doc, game);
    const body = rows.map((row) => {
      const d = row.deal;
      let first;
      if (row.ann) first = [row.number, '', LABELS[row.ann.type], name(row.ann.beneficiary), '', '', '', ''];
      else if (d.type === 'passed') first = [row.number, d.dealer ? name(d.dealer) : '', LABELS.passed, '', '', '', '', ''];
      else if (d.type === 'goulasch') first = [row.number, d.dealer ? name(d.dealer) : '', LABELS.goulasch, name(d.winner), name(d.loser), d.dead.map(name).join(' + '), '', ''];
      else {
        first = [row.number, d.dealer ? name(d.dealer) : '', LABELS[d.contract], name(d.taker), d.partner ? name(d.partner) : '',
          d.dead.map(name).join(' + '), yesNo(d.succeeded), d.pointDiff];
      }
      const scores = ids.map((id) => (d.players.includes(id) ? (row.scores[id] || 0) : ''));
      const cumul = ids.map((id) => row.cumulative[id] || 0);
      return first.concat(scores, cumul);
    });
    return { header, rows: body };
  }

  /**
   * The statistics as several tables { name, header, rows, percentCols }: ranking, takes per contract,
   * announcements per type, partners called. Shares and rates are fractions (0.8 = 80 %).
   */
  function statsTables(doc, st) {
    const name = (id) => playerName(doc, id);
    const ids = Object.keys(st.players).filter((id) => st.players[id].games > 0)
      .sort((a, b) => (st.players[b].avgPointsPerGame || 0) - (st.players[a].avgPointsPerGame || 0));
    const subjects = ids.map((id) => [name(id), st.players[id]]).concat([['Total', st.total]]);
    const nz = (v) => (v === null || v === undefined ? '' : v);
    const ranking = {
      name: 'Classement', percentCols: [9, 11],
      header: ['Joueur', 'Parties', 'Donnes', 'Points', 'Moyenne par partie', 'Victoires', 'Dernières places', 'Prises', 'Réussies', 'Taux de réussite',
        'Écart moyen', 'Auto-appels (part des prises)', 'Annonces', 'Annonces pour 10 donnes', 'Annonces par partie', 'Goulasch gagnés', 'Goulasch perdus', 'Solde Goulasch'],
      rows: subjects.map(([n, p]) => [n, p.games, p.deals, p.points, nz(p.avgPointsPerGame), n === 'Total' ? '' : p.wins, n === 'Total' ? '' : p.lasts,
        p.takes.count, p.takes.succeeded, nz(p.takes.rate), nz(p.takes.avgDiff), nz(p.takes.selfCallShare), p.announcements.count,
        nz(p.announcements.per10Deals), nz(p.announcements.perGame), p.goulasch.won, n === 'Total' ? '' : p.goulasch.lost, n === 'Total' ? '' : p.goulasch.balance]),
    };
    const takes = { name: 'Prises', percentCols: [3, 5], header: ['Joueur', 'Contrat', 'Nombre', 'Répartition', 'Réussies', 'Taux de réussite', 'Écart moyen'], rows: [] };
    const announcements = { name: 'Annonces', percentCols: [3], header: ['Joueur', 'Annonce', 'Nombre', 'Répartition'], rows: [] };
    const partners = { name: 'Partenaires', percentCols: [], header: ['Preneur', 'Appelé', 'Nombre'], rows: [] };
    for (const [n, p] of subjects) {
      for (const k of CONTRACT_KEYS) { const b = p.takes.byContract[k]; if (b) takes.rows.push([n, LABELS[k], b.count, nz(b.share), b.succeeded, nz(b.rate), nz(b.avgDiff)]); }
      for (const k of ANNOUNCEMENT_KEYS) { const c = p.announcements.byType[k]; if (c) announcements.rows.push([n, LABELS[k], c, nz(p.announcements.shares[k])]); }
      for (const pid of Object.keys(p.partners).sort((a, b) => p.partners[b] - p.partners[a])) partners.rows.push([n, name(pid), p.partners[pid]]);
    }
    return [ranking, takes, announcements, partners];
  }

  /** CSV for a French spreadsheet: ';' separator, decimal comma, quotes doubled, BOM so that Excel reads UTF-8. */
  function toCsv(header, rows) {
    const cell = (v) => {
      if (v === null || v === undefined) return '';
      if (typeof v === 'number') return String(Math.round(v * 10000) / 10000).replace('.', ',');
      const t = String(v);
      return /[;"\n\r]/.test(t) ? `"${t.replace(/"/g, '""')}"` : t;
    };
    return '\ufeff' + [header].concat(rows).map((r) => r.map(cell).join(';')).join('\r\n') + '\r\n';
  }

  // ------------------------------ documents ----------------------------------

  function createDocument() {
    return { schemaVersion: SCHEMA_VERSION, rev: 0, updatedAt: null, players: [], rules: presetRules(), games: [], log: [] };
  }

  /**
   * Upgrades an older document to the current schema and rejects unknown ones. Rule sets are history, so
   * those used by a game are kept, only completed with announcements added since (disabled by default
   * would hide them: they are added enabled with the preset values). Preset rule sets no game uses are
   * refreshed to the current presets.
   */
  function migrate(doc) {
    if (!doc || typeof doc !== 'object') throw new Error('Fichier invalide.');
    if (typeof doc.schemaVersion !== 'number') throw new Error('Fichier invalide : schemaVersion manquant.');
    if (doc.schemaVersion > SCHEMA_VERSION) throw new Error('Ce fichier vient d\'une version plus récente de l\'application.');
    for (const key of ['players', 'rules', 'games']) {
      if (!Array.isArray(doc[key])) throw new Error(`Fichier invalide : "${key}" manquant.`);
    }
    if (!Array.isArray(doc.log)) doc.log = [];
    const presets = presetRules();
    const used = new Set();
    for (const g of doc.games) { used.add(g.rulesId); for (const d of g.deals) if (d.rulesId) used.add(d.rulesId); }
    doc.rules = doc.rules.map((r) => {
      const preset = presets.find((x) => x.id === r.id);
      if (preset && !used.has(r.id)) return preset;
      for (const key of ANNOUNCEMENT_KEYS) {
        if (!r.announcements[key]) r.announcements[key] = JSON.parse(JSON.stringify((preset || presets[2]).announcements[key]));
      }
      return r;
    });
    for (const preset of presets) if (!doc.rules.some((r) => r.id === preset.id)) doc.rules.push(preset);
    return doc;
  }

  function findOrAddPlayer(doc, firstName) {
    const name = firstName.trim();
    if (!name) throw new Error('Le prénom est vide.');
    const existing = doc.players.find((p) => p.firstName.toLowerCase() === name.toLowerCase());
    if (existing) return existing;
    const player = { id: newId(), firstName: name };
    doc.players.push(player);
    return player;
  }

  function playerName(doc, id) {
    const p = doc.players.find((x) => x.id === id);
    return p ? p.firstName : '?';
  }

  // -------------------------------- games ------------------------------------

  /** Creates a game; the previous in-progress game, if any, is archived. */
  function createGame(doc, { date, rulesId, rules, playerIds }) {
    if (playerIds.length < MIN_PLAYERS || playerIds.length > MAX_PLAYERS) throw new Error('Une partie réunit 3 à 7 joueurs.');
    if (new Set(playerIds).size !== playerIds.length) throw new Error('Un joueur est présent plusieurs fois.');
    if (rules) rulesId = findOrAddRules(doc, rules).id; // configured at creation: the presets are only default values
    if (!doc.rules.some((r) => r.id === rulesId)) throw new Error('Jeu de règles inconnu.');
    for (const g of doc.games) if (g.state === 'in_progress') g.state = 'archived';
    const game = {
      id: newId(), date, rulesId, state: 'in_progress',
      tableOrder: playerIds.slice(), present: playerIds.slice(), deals: [],
    };
    doc.games.push(game);
    return game;
  }

  function currentGame(doc) { return doc.games.find((g) => g.state === 'in_progress') || null; }

  function checkedDeal(rules, deal) {
    const errors = validateDeal(rules, deal);
    if (errors.length) throw new Error(errors.join(' '));
    return deal;
  }

  function buildDeal(game, input, rulesId) {
    const deal = {
      id: input.id || newId(),
      number: 0,
      dealer: input.dealer,
      type: input.type,
      rulesId,
      players: input.players.slice(),
      dead: (input.dead || []).slice(),
      announcements: input.announcements || [],
      scores: {},
    };
    if (input.type === 'contract') {
      deal.contract = input.contract;
      deal.taker = input.taker;
      deal.partner = input.players.length >= 5 ? input.partner : null;
      deal.succeeded = input.succeeded;
      deal.pointDiff = input.pointDiff;
    } else if (input.type === 'goulasch') {
      deal.winner = input.winner;
      deal.loser = input.loser;
    }
    return deal;
  }

  /**
   * Appends a deal. When the chosen dealer is not the expected one:
   * - Goulasch disabled: a passed deal is added for every skipped dealer, looping around the table;
   * - Goulasch enabled: nobody skips a deal (everybody passing means a Goulasch is played), so nothing is added
   *   and the gap is only reported (`dealerWarning`): a deal is missing or a player forgot to deal.
   * The very first deal of a game is free: no dealer is expected for it.
   * Returns { deal, passes, dealerWarning }.
   */
  function addDeal(doc, game, input) {
    const rules = rulesFor(doc, game);
    const deal = checkedDeal(rules, buildDeal(game, input, game.rulesId));
    const passes = [];
    let dealerWarning = false;
    const expected = game.deals.length ? expectedDealer(game) : null;
    if (expected && deal.dealer !== expected) {
      if (goulaschEnabled(rules)) {
        dealerWarning = true;
      } else {
        let d = expected;
        for (let guard = 0; d !== deal.dealer && guard < game.tableOrder.length; guard += 1) {
          passes.push({
            id: newId(), number: 0, dealer: d, type: 'passed', rulesId: game.rulesId,
            players: presentPlayers(game), dead: [], announcements: [], scores: {},
          });
          d = nextDealer(game, d);
        }
      }
    }
    for (const p of passes) game.deals.push(p);
    game.deals.push(deal);
    recomputeGame(doc, game);
    return { deal, passes, dealerWarning };
  }

  /** Next dealer after `dealerId` in the table order, among `allowed` players only. */
  function nextDealerAmong(order, dealerId, allowed) {
    const start = order.indexOf(dealerId);
    for (let i = 1; i <= order.length; i += 1) {
      const candidate = order[(start + i) % order.length];
      if (allowed.includes(candidate)) return candidate;
    }
    return dealerId;
  }

  /**
   * Ids of the deals whose dealer is not the one expected after the previous deal. The expected dealer is
   * derived from the players of the deal itself (who was at the table then), not from the current attendance,
   * so a later departure or arrival never changes the verdict on earlier deals.
   * With the Goulasch enabled this means a deal is missing or a player forgot to deal.
   */
  function dealerGaps(game) {
    const gaps = [];
    for (let i = 1; i < game.deals.length; i += 1) {
      const deal = game.deals[i];
      if (deal.type === 'passed' || !deal.dealer || !game.deals[i - 1].dealer) continue; // unknown dealer: nothing to check
      if (deal.dealer !== nextDealerAmong(game.tableOrder, game.deals[i - 1].dealer, deal.players)) gaps.push(deal.id);
    }
    return gaps;
  }

  /** Inserts a forgotten deal after `afterDealId` (null = at the very beginning). No passed deals are added. */
  function insertDealAfter(doc, game, afterDealId, input) {
    const rules = rulesFor(doc, game);
    const deal = checkedDeal(rules, buildDeal(game, input, game.rulesId));
    const index = afterDealId ? game.deals.findIndex((d) => d.id === afterDealId) + 1 : 0;
    if (afterDealId && index === 0) throw new Error('Donne introuvable.');
    game.deals.splice(index, 0, deal);
    recomputeGame(doc, game);
    return deal;
  }

  function findDeal(game, dealId) {
    const deal = game.deals.find((d) => d.id === dealId);
    if (!deal) throw new Error('Donne introuvable.');
    return deal;
  }

  /**
   * Replaces the content of a deal. Changing between a contract and a Goulasch (or a passed deal)
   * removes its announcements. Announcements whose beneficiary is no longer active are rejected.
   */
  function updateDeal(doc, game, dealId, input) {
    const old = findDeal(game, dealId);
    const rules = rulesFor(doc, game, old);
    const keep = input.type === 'contract' && old.type === 'contract' ? old.announcements : [];
    const fresh = buildDeal(game, Object.assign({}, input, { id: old.id, announcements: keep }), old.rulesId);
    if (old.historical) fresh.historical = false;
    checkedDeal(rules, fresh);
    for (const ann of fresh.announcements) {
      const errors = validateAnnouncement(rules, fresh, ann);
      if (errors.length) throw new Error(errors.join(' '));
    }
    game.deals[game.deals.indexOf(old)] = fresh;
    recomputeGame(doc, game);
    return fresh;
  }

  function deleteDeal(doc, game, dealId) {
    const deal = findDeal(game, dealId);
    game.deals.splice(game.deals.indexOf(deal), 1);
    recomputeGame(doc, game);
  }

  function addAnnouncement(doc, game, dealId, { type, beneficiary }) {
    const deal = findDeal(game, dealId);
    const ann = { id: newId(), type, beneficiary, scores: {} };
    const errors = validateAnnouncement(rulesFor(doc, game, deal), deal, ann);
    if (errors.length) throw new Error(errors.join(' '));
    deal.announcements.push(ann);
    recomputeGame(doc, game);
    return ann;
  }

  function findAnnouncement(deal, annId) {
    const ann = deal.announcements.find((a) => a.id === annId);
    if (!ann) throw new Error('Annonce introuvable.');
    return ann;
  }

  function updateAnnouncement(doc, game, dealId, annId, { type, beneficiary }) {
    const deal = findDeal(game, dealId);
    const ann = findAnnouncement(deal, annId);
    const next = { id: ann.id, type, beneficiary, scores: {} };
    const errors = validateAnnouncement(rulesFor(doc, game, deal), deal, next);
    if (errors.length) throw new Error(errors.join(' '));
    deal.announcements[deal.announcements.indexOf(ann)] = next;
    recomputeGame(doc, game);
    return next;
  }

  function deleteAnnouncement(doc, game, dealId, annId) {
    const deal = findDeal(game, dealId);
    deal.announcements.splice(deal.announcements.indexOf(findAnnouncement(deal, annId)), 1);
    recomputeGame(doc, game);
  }

  /** Sets who is still at the table for the following deals (departed players keep their column). */
  function setPresentPlayers(game, playerIds) {
    if (playerIds.length < MIN_PLAYERS || playerIds.length > MAX_PLAYERS) throw new Error('Il faut entre 3 et 7 joueurs à table.');
    for (const p of playerIds) if (!game.tableOrder.includes(p)) throw new Error('Joueur inconnu dans cette partie.');
    game.present = game.tableOrder.filter((p) => playerIds.includes(p));
  }

  /** Seats a new player after `afterPlayerId` in the table order and marks them present. */
  function addPlayerToTable(game, playerId, afterPlayerId) {
    if (game.tableOrder.includes(playerId)) {
      if (!game.present.includes(playerId)) game.present.push(playerId);
      game.present = game.tableOrder.filter((p) => game.present.includes(p));
      return;
    }
    if (game.present.length >= MAX_PLAYERS) throw new Error('Une partie réunit 7 joueurs au maximum.');
    const at = game.tableOrder.indexOf(afterPlayerId);
    game.tableOrder.splice(at < 0 ? game.tableOrder.length : at + 1, 0, playerId);
    game.present.push(playerId);
    game.present = game.tableOrder.filter((p) => game.present.includes(p));
  }

  /**
   * Changes the rules of a game. The edited rule set is stored as a new version (rule sets are never
   * modified in place). scope 'following': only deals added from now on use it; 'all': recalculates everything.
   */
  function changeRules(doc, game, newRules, scope) {
    const version = findOrAddRules(doc, Object.assign({}, newRules, { name: newRules.name || rulesFor(doc, game).name }));
    if (scope === 'all') for (const d of game.deals) d.rulesId = version.id;
    game.rulesId = version.id;
    recomputeGame(doc, game);
    return version;
  }

  function endGame(game) { game.state = 'archived'; }

  /** Changes the date of a game (the old workbook's sheet name is only the creation date, so it must be correctable). */
  function setGameDate(game, date) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date) || Number.isNaN(Date.parse(date))) throw new Error('Date invalide.');
    game.date = date;
  }

  /** Removes a game for good, with its change log entries. */
  function deleteGame(doc, gameId) {
    const i = doc.games.findIndex((g) => g.id === gameId);
    if (i < 0) throw new Error('Partie introuvable.');
    doc.games.splice(i, 1);
    if (Array.isArray(doc.log)) doc.log = doc.log.filter((e) => e.game !== gameId);
  }

  /** Final ranking of a game: [{ playerId, total }] best first. */
  function ranking(doc, game) {
    const { totals } = recomputeGame(doc, game);
    return Object.keys(totals).map((playerId) => ({ playerId, total: totals[playerId] })).sort((a, b) => b.total - a.total);
  }

  // ------------------------------ statistics ---------------------------------

  const ratio = (a, b) => (b ? a / b : null);

  function blankPlayerStats() {
    return {
      games: 0, deals: 0, points: 0, wins: 0, lasts: 0,
      takes: { count: 0, succeeded: 0, diffSum: 0, selfCalls: 0, byContract: {} },
      announcements: { count: 0, byType: {} },
      partners: {}, // partner id -> number of times this player (as taker) called them (self-call included)
      goulasch: { won: 0, lost: 0, balance: 0 },
    };
  }

  /**
   * Statistics over the games dated within [from, to] (YYYY-MM-DD, both optional). Passed deals never count;
   * the Goulasch counts as a deal played by every player of the deal but is kept out of the takes. Wins and last
   * places are only counted on archived games (the result of a game in progress is not final).
   * Returns { period, games, deals, players: { id: stats }, total: stats }; every stats object holds counters
   * and derived values (shares, rates, averages; null when undefined).
   */
  function computeStats(doc, { from = null, to = null } = {}) {
    const games = doc.games.filter((g) => (!from || g.date >= from) && (!to || g.date <= to));
    const players = {};
    const total = blankPlayerStats();
    const of = (id) => players[id] || (players[id] = blankPlayerStats());
    let totalDeals = 0;

    for (const game of games) {
      const played = game.deals.filter((d) => d.type !== 'passed');
      if (!played.length) continue;
      total.games += 1;
      const gamePoints = {};
      for (const deal of played) {
        totalDeals += 1;
        total.deals += 1;
        for (const id of deal.players) { of(id).deals += 1; if (!(id in gamePoints)) gamePoints[id] = 0; }
        for (const id of game.tableOrder) if (!(id in gamePoints)) gamePoints[id] = 0;
        for (const id of Object.keys(deal.scores)) gamePoints[id] = (gamePoints[id] || 0) + deal.scores[id];
        for (const ann of deal.announcements || []) {
          for (const id of Object.keys(ann.scores)) gamePoints[id] = (gamePoints[id] || 0) + ann.scores[id];
          const st = of(ann.beneficiary).announcements;
          st.count += 1;
          st.byType[ann.type] = (st.byType[ann.type] || 0) + 1;
          total.announcements.count += 1;
          total.announcements.byType[ann.type] = (total.announcements.byType[ann.type] || 0) + 1;
        }
        if (deal.type === 'goulasch') {
          const w = of(deal.winner).goulasch;
          const l = of(deal.loser).goulasch;
          w.won += 1; w.balance += deal.scores[deal.winner];
          l.lost += 1; l.balance += deal.scores[deal.loser];
          total.goulasch.won += 1;
          continue;
        }
        const t = of(deal.taker).takes;
        const bucket = (takes) => takes.byContract[deal.contract] || (takes.byContract[deal.contract] = { count: 0, succeeded: 0, diffSum: 0 });
        for (const takes of [t, total.takes]) {
          takes.count += 1;
          if (deal.succeeded) takes.succeeded += 1;
          takes.diffSum += deal.pointDiff;
          const b = bucket(takes);
          b.count += 1;
          if (deal.succeeded) b.succeeded += 1;
          b.diffSum += deal.pointDiff;
        }
        if (deal.partner) {
          for (const partners of [of(deal.taker).partners, total.partners]) partners[deal.partner] = (partners[deal.partner] || 0) + 1;
          if (deal.partner === deal.taker) { t.selfCalls += 1; total.takes.selfCalls += 1; }
        }
      }
      // a game counts for everyone seated at its table (like the old workbook), even if they only watched the deals
      for (const id of game.tableOrder) of(id).games += 1;
      for (const id of Object.keys(gamePoints)) { of(id).points += gamePoints[id]; total.points += gamePoints[id]; }
      if (game.state === 'archived') {
        const values = Object.values(gamePoints);
        const best = Math.max(...values);
        const worst = Math.min(...values);
        if (best !== worst) {
          for (const id of Object.keys(gamePoints)) {
            if (gamePoints[id] === best) of(id).wins += 1;
            if (gamePoints[id] === worst) of(id).lasts += 1;
          }
        }
      }
    }

    const derive = (st, isTotal) => {
      st.participation = ratio(st.games, total.games);
      st.dealShare = isTotal ? null : ratio(st.deals, totalDeals);
      st.avgDealsPerGame = ratio(st.deals, st.games);
      st.avgPointsPerGame = ratio(st.points, st.games);
      st.reliable = st.games >= 10;
      const tk = st.takes;
      tk.rate = ratio(tk.succeeded, tk.count);
      tk.avgDiff = ratio(tk.diffSum, tk.count);
      tk.selfCallShare = ratio(tk.selfCalls, tk.count);
      for (const key of Object.keys(tk.byContract)) {
        const b = tk.byContract[key];
        b.share = ratio(b.count, tk.count);
        b.rate = ratio(b.succeeded, b.count);
        b.avgDiff = ratio(b.diffSum, b.count);
      }
      const an = st.announcements;
      an.per10Deals = st.deals ? (an.count * 10) / st.deals : null;
      an.perGame = ratio(an.count, st.games);
      an.shares = {};
      for (const key of Object.keys(an.byType)) an.shares[key] = ratio(an.byType[key], an.count);
    };
    for (const id of Object.keys(players)) derive(players[id], false);
    derive(total, true);
    // how many times each player was called as partner (by anyone, themselves included)
    for (const id of Object.keys(players)) players[id].calledCount = 0;
    for (const taker of Object.keys(players)) {
      for (const partner of Object.keys(players[taker].partners)) {
        if (players[partner]) players[partner].calledCount += players[taker].partners[partner];
      }
    }
    return { period: { from, to }, games: total.games, deals: totalDeals, players, total };
  }

  root.TarotEngine = {
    SCHEMA_VERSION, MIN_PLAYERS, MAX_PLAYERS, MAX_POINT_DIFF, CONTRACT_KEYS, ANNOUNCEMENT_KEYS, LABELS, THRESHOLDS,
    newId, setIdGenerator, localDate,
    presetRules, validateRules, sameRules, findOrAddRules, validContracts, validAnnouncements, goulaschEnabled,
    roundTo, contractValue, contractScores, announcementScores, sumScores, activePlayers, rulesFor,
    recomputeGame, evolution, presentPlayers, nextDealer, expectedDealer, dealerGaps, attackingTeam,
    validateDeal, validateAnnouncement, assistedResult,
    createDocument, migrate, findOrAddPlayer, playerName, dealSummary, describeChange, gameTable, statsTables, toCsv,
    createGame, currentGame, addDeal, insertDealAfter, updateDeal, deleteDeal,
