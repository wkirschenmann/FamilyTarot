<script id="app">
(function () {
  'use strict';
  const { html, render, useState, useEffect, useRef } = window.htmPreact;
  const E = window.TarotEngine;
  const BUILD = /^__/.test(window.TAROT_BUILD || '') || !window.TAROT_BUILD ? 'dev' : window.TAROT_BUILD;

  // ------------------------------ storage ------------------------------------
  // The whole document (tarot.json) lives in one IndexedDB record, written before the screen updates.

  const idb = {
    db: null,
    open() {
      if (this.db) return Promise.resolve(this.db);
      return new Promise((resolve, reject) => {
        const req = indexedDB.open('tarot', 1);
        req.onupgradeneeded = () => req.result.createObjectStore('kv');
        req.onsuccess = () => { this.db = req.result; resolve(req.result); };
        req.onerror = () => reject(req.error);
      });
    },
    async get(key) {
      const db = await this.open();
      return new Promise((resolve, reject) => {
        const req = db.transaction('kv').objectStore('kv').get(key);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    },
    async put(key, value) {
      const db = await this.open();
      return new Promise((resolve, reject) => {
        const tx = db.transaction('kv', 'readwrite');
        tx.objectStore('kv').put(value, key);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
        tx.onabort = () => reject(tx.error);
      });
    },
  };

  // ------------------------------ helpers ------------------------------------

  const L = E.LABELS;
  const fmt = (n) => (n < 0 ? '−' + Math.abs(n) : String(n));
  const cls = (n) => (n > 0 ? 'pos' : n < 0 ? 'neg' : '');
  const today = () => E.localDate(new Date());
  const frDate = (iso) => (iso || '').split('-').reverse().join('/');
  const clone = (x) => JSON.parse(JSON.stringify(x));

  function dealLabel(doc, deal) {
    const name = (id) => E.playerName(doc, id);
    if (deal.type === 'passed') return `${L.passed}`;
    if (deal.type === 'goulasch') return `${L.goulasch} — ${name(deal.winner)} gagne, ${name(deal.loser)} perd`;
    let who = name(deal.taker);
    if (deal.players.length >= 5) who += deal.partner === deal.taker ? ' (s’appelle)' : ` + ${name(deal.partner)}`;
    return `${L[deal.contract]} — ${who} · ${deal.succeeded ? 'réalisé de' : 'chuté de'} ${deal.pointDiff}`;
  }

  function download(filename, content, type = 'application/json') {
    const url = URL.createObjectURL(content instanceof Blob ? content : new Blob([content], { type }));
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  // ------------------------------ exports ------------------------------------

  let sheetJs = null;
  /** SheetJS is a big file: loaded only when an Excel export is requested (cached by the service worker). */
  function loadSheetJs() {
    if (window.XLSX) return Promise.resolve(window.XLSX);
    if (!sheetJs) {
      sheetJs = new Promise((resolve, reject) => {
        const el = document.createElement('script');
        el.src = 'xlsx.full.min.js';
        el.onload = () => resolve(window.XLSX);
        el.onerror = () => { sheetJs = null; reject(new Error('Export Excel indisponible : le module n’a pas pu être chargé (hors ligne ?).')); };
        document.head.appendChild(el);
      });
    }
    return sheetJs;
  }

  /** tables: [{ name, header, rows, percentCols }] -> one sheet each. */
  async function downloadExcel(filename, tables) {
    const X = await loadSheetJs();
    const wb = X.utils.book_new();
    for (const t of tables) {
      const ws = X.utils.aoa_to_sheet([t.header].concat(t.rows));
      ws['!cols'] = t.header.map((h) => ({ wch: Math.max(9, String(h).length + 2) }));
      for (const c of t.percentCols || []) {
        for (let r = 1; r <= t.rows.length; r += 1) {
          const cell = ws[X.utils.encode_cell({ r, c })];
          if (cell && typeof cell.v === 'number') cell.z = '0.0%';
        }
      }
      X.utils.book_append_sheet(wb, ws, t.name.replace(/[\\/?*[\]:]/g, ' ').slice(0, 31));
    }
    const data = X.write(wb, { bookType: 'xlsx', type: 'array' });
    download(filename, new Blob([data], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
  }

  function downloadCsv(filename, header, rows) {
    download(filename, E.toCsv(header, rows), 'text/csv;charset=utf-8');
  }

  function ExportButtons({ onCsv, onExcel, hint }) {
    const [error, setError] = useState('');
    return html`<div>
      <div class="row"><span class="muted">Exporter :</span>
        <button class="btn small" onClick=${() => { setError(''); onCsv(); }}>CSV</button>
        <button class="btn small" onClick=${() => { setError(''); onExcel().catch((e) => setError(e.message)); }}>Excel</button></div>
      ${hint ? html`<div class="muted" style="font-size:.82rem">${hint}</div>` : null}
      ${error ? html`<div class="error" role="alert">${error}</div>` : null}
    </div>`;
  }

  // ------------------------------ UI bricks ----------------------------------

  function Modal({ title, onClose, children }) {
    return html`<div class="overlay" onClick=${(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div class="modal" role="dialog" aria-label=${title}>
        <div class="row"><h3 class="grow">${title}</h3><button class="btn small" onClick=${onClose} aria-label="Fermer">✕</button></div>
        ${children}
      </div></div>`;
  }

  function Field({ label, group, children }) {
    return group
      ? html`<div class="field" role="group" aria-label=${label}><span>${label}</span>${children}</div>`
      : html`<label class="field"><span>${label}</span>${children}</label>`;
  }

  function PlayerSelect({ doc, ids, value, onChange, empty = '— choisir —', exclude = [] }) {
    return html`<select value=${value || ''} onChange=${(e) => onChange(e.target.value || null)}>
      <option value="">${empty}</option>
      ${ids.filter((id) => !exclude.includes(id) || id === value).map((id) => html`<option value=${id} selected=${id === value}>${E.playerName(doc, id)}</option>`)}
    </select>`;
  }

  // ------------------------------ deal form ----------------------------------

  function DealForm({ doc, game, deal, afterDealId, onSubmit, onClose }) {
    const rules = E.rulesFor(doc, game, deal);
    const editing = !!deal;
    const inserting = afterDealId !== undefined && !editing;
    const initialPlayers = editing ? deal.players : E.presentPlayers(game);
    const contractOptions = E.validContracts(rules).slice();
    if (editing && deal.type === 'contract' && !contractOptions.includes(deal.contract)) contractOptions.push(deal.contract);
    const goulasch = E.goulaschEnabled(rules) || (editing && deal.type === 'goulasch');

    const [dealer, setDealer] = useState(editing ? deal.dealer : (inserting
      ? (afterDealId ? (E.nextDealer(game, game.deals.find((d) => d.id === afterDealId).dealer) || null) : E.presentPlayers(game)[0])
      : E.expectedDealer(game)));
    const [players, setPlayers] = useState(initialPlayers);
    const [kind, setKind] = useState(editing ? (deal.type === 'contract' ? deal.contract : deal.type) : contractOptions[0]);
    const [taker, setTaker] = useState(editing ? deal.taker : null);
    const [partner, setPartner] = useState(editing ? deal.partner : null);
    const [dead, setDead] = useState(editing ? deal.dead : []);
    const [winner, setWinner] = useState(editing ? deal.winner : null);
    const [loser, setLoser] = useState(editing ? deal.loser : null);
    const [succeeded, setSucceeded] = useState(editing && deal.type === 'contract' ? deal.succeeded : null);
    const [diff, setDiff] = useState(editing && deal.type === 'contract' ? String(deal.pointDiff) : '');
    const [oudlers, setOudlers] = useState(null);
    const [points, setPoints] = useState('');
    const [error, setError] = useState('');

    const n = players.length;
    const deadCount = Math.max(0, n - 5);
    const active = players.filter((p) => !dead.includes(p));
    const isGoulasch = kind === 'goulasch';
    const isPassed = kind === 'passed';
    const tableOrder = game.tableOrder;

    // Who will be skipped (passed deals) when the dealer differs from the expected one.
    const goulaschOn = E.goulaschEnabled(rules);
    let skipped = [];
    const expectedNow = game.deals.length ? E.expectedDealer(game) : null;
    const unexpectedDealer = !editing && !inserting && !!expectedNow && dealer !== expectedNow;
    if (!goulaschOn && !editing && !inserting && expectedNow) {
      let d = expectedNow;
      for (let i = 0; d !== dealer && i < game.tableOrder.length; i += 1) { skipped.push(d); d = E.nextDealer(game, d); }
    }

    function togglePlayer(id) {
      const next = players.includes(id) ? players.filter((p) => p !== id) : tableOrder.filter((p) => players.includes(p) || p === id);
      setPlayers(next);
      setDead(dead.filter((p) => next.includes(p)));
      if (!next.includes(taker)) setTaker(null);
      if (!next.includes(partner)) setPartner(null);
      if (!next.includes(winner)) setWinner(null);
      if (!next.includes(loser)) setLoser(null);
      if (!next.includes(dealer)) setDealer(next[0] || null);
    }
    function setDeadAt(i, id) {
      const next = dead.slice();
      if (id) next[i] = id; else next.splice(i, 1);
      setDead(next.filter(Boolean));
    }
    function applyAssist() {
      try {
        if (points.trim() === '') throw new Error('Indiquez les points réalisés.');
        const r = E.assistedResult(oudlers, Number(points.replace(',', '.')));
        setSucceeded(r.succeeded); setDiff(String(r.pointDiff)); setError('');
      } catch (e) { setError(e.message); }
    }

    async function submit() {
      const input = { dealer, players, dead };
      if (isPassed) input.type = 'passed';
      else if (isGoulasch) Object.assign(input, { type: 'goulasch', winner, loser });
      else {
        Object.assign(input, {
          type: 'contract', contract: kind, taker, partner: n >= 5 ? partner : null, succeeded,
          pointDiff: diff === '' ? NaN : Number(diff),
        });
      }
      if (isPassed) input.dead = [];
      const res = await onSubmit(input);
      if (res && res.error) setError(res.error);
    }

    return html`<${Modal} title=${editing ? `Modifier la donne ${deal.number}` : inserting ? 'Rajouter une donne oubliée' : 'Nouvelle donne'} onClose=${onClose}>
      <${Field} label="Donneur">
        <${PlayerSelect} doc=${doc} ids=${players} value=${dealer} onChange=${setDealer} />
      <//>
      ${skipped.length ? html`<div class="info">${skipped.length} tour${skipped.length > 1 ? 's' : ''} passé${skipped.length > 1 ? 's' : ''} ajouté${skipped.length > 1 ? 's' : ''} automatiquement (${skipped.map((p) => E.playerName(doc, p)).join(', ')}).</div>` : null}
      ${goulaschOn && unexpectedDealer ? html`<div class="warn" role="alert">⚠ Ce n’est pas le donneur attendu (${E.playerName(doc, expectedNow)}). Avec le Goulasch, personne ne passe son tour : il manque peut-être une donne, ou un joueur a oublié de distribuer. Vous pouvez valider quand même.</div>` : null}
      <${Field} label="Contrat">
        <select value=${kind} onChange=${(e) => setKind(e.target.value)}>
          ${contractOptions.map((k) => html`<option value=${k} selected=${k === kind}>${L[k]}</option>`)}
          ${goulasch ? html`<option value="goulasch" selected=${kind === 'goulasch'}>${L.goulasch}</option>` : null}
          ${editing ? html`<option value="passed" selected=${kind === 'passed'}>${L.passed}</option>` : null}
        </select>
      <//>

      ${isPassed ? null : isGoulasch ? html`
        <div class="grid2">
          <${Field} label="Gagnant"><${PlayerSelect} doc=${doc} ids=${active} value=${winner} onChange=${setWinner} exclude=${[loser]} /><//>
          <${Field} label="Perdant"><${PlayerSelect} doc=${doc} ids=${active} value=${loser} onChange=${setLoser} exclude=${[winner]} /><//>
        </div>
        ` : html`
        <div class="grid2">
          <${Field} label="Preneur"><${PlayerSelect} doc=${doc} ids=${active} value=${taker} onChange=${setTaker} /><//>
          ${n >= 5 ? html`<${Field} label="Appelé"><${PlayerSelect} doc=${doc} ids=${active} value=${partner} onChange=${setPartner} /><//>` : null}
        </div>
        <${Field} label="Contrat réalisé ?" group=${true}>
          <div class="seg">
            <button class="btn" aria-pressed=${succeeded === true} onClick=${() => setSucceeded(true)}>Oui</button>
            <button class="btn" aria-pressed=${succeeded === false} onClick=${() => setSucceeded(false)}>Non</button>
          </div>
        <//>
        <${Field} label="Écart de points (0 à ${E.MAX_POINT_DIFF})">
          <input type="number" inputmode="numeric" min="0" max=${E.MAX_POINT_DIFF} value=${diff} onInput=${(e) => setDiff(e.target.value)} />
        <//>
        <details>
          <summary>Saisie assistée (bouts et points)</summary>
          <div class="row">
            ${[0, 1, 2, 3].map((k) => html`<button class="chip" aria-pressed=${oudlers === k} onClick=${() => setOudlers(k)}>${k} bout${k > 1 ? 's' : ''}</button>`)}
          </div>
          <div class="row" style="margin-top:8px">
            <input type="text" inputmode="decimal" placeholder="Points réalisés (ex. 41,5)" style="max-width:15em" value=${points} onInput=${(e) => setPoints(e.target.value)} />
            <button class="btn" disabled=${oudlers === null} onClick=${applyAssist}>Calculer</button>
          </div>
        </details>`}

      ${!isPassed && deadCount > 0 ? html`
        <div class="grid2">
          ${Array.from({ length: deadCount }, (_, i) => html`<${Field} label=${deadCount > 1 ? `Mort ${i + 1}` : 'Mort'}>
            <${PlayerSelect} doc=${doc} ids=${players.filter((p) => p !== taker && p !== partner && p !== winner && p !== loser)} value=${dead[i]} onChange=${(id) => setDeadAt(i, id)} exclude=${dead.filter((_, j) => j !== i)} />
          <//>`)}
        </div>` : null}

      <details>
        <summary>Joueurs de cette donne (${n})</summary>
        <div class="row">
          ${tableOrder.map((id) => html`<button class="chip" aria-pressed=${players.includes(id)} onClick=${() => togglePlayer(id)}>${E.playerName(doc, id)}</button>`)}
        </div>
      </details>

      ${error ? html`<div class="error" role="alert">${error}</div>` : null}
      <div class="row end" style="margin-top:12px">
        <button class="btn" onClick=${onClose}>Annuler</button>
        <button class="btn primary" onClick=${submit}>${editing ? 'Enregistrer' : 'Valider'}</button>
      </div>
    <//>`;
  }

  // ------------------------------ announcement form --------------------------

  function AnnouncementForm({ doc, game, dealId, ann, onSubmit, onClose }) {
    const contractDeals = game.deals.filter((d) => d.type === 'contract');
    const [chosenDeal, setChosenDeal] = useState(dealId || (contractDeals.length ? contractDeals[contractDeals.length - 1].id : null));
    const deal = game.deals.find((d) => d.id === chosenDeal);
    const rules = deal ? E.rulesFor(doc, game, deal) : null;
    const options = rules ? E.validAnnouncements(rules).slice() : [];
    if (ann && !options.includes(ann.type)) options.push(ann.type);
    const [type, setType] = useState(ann ? ann.type : options[0]);
    const [beneficiary, setBeneficiary] = useState(ann ? ann.beneficiary : null);
    const [error, setError] = useState('');
    if (!deal) return html`<${Modal} title="Annonce" onClose=${onClose}><p>Ajoutez d’abord un contrat : une annonce se rattache à une donne.</p><//>`;
    async function submit() {
      const res = await onSubmit(chosenDeal, { type, beneficiary });
      if (res && res.error) setError(res.error);
    }
    return html`<${Modal} title=${ann ? 'Modifier l’annonce' : 'Nouvelle annonce'} onClose=${onClose}>
      ${ann ? null : html`<${Field} label="Donne">
        <select value=${chosenDeal} onChange=${(e) => { setChosenDeal(e.target.value); setBeneficiary(null); }}>
          ${contractDeals.map((d) => html`<option value=${d.id} selected=${d.id === chosenDeal}>${d.number} — ${dealLabel(doc, d)}</option>`)}
        </select><//>`}
      <${Field} label="Annonce">
        <select value=${type} onChange=${(e) => setType(e.target.value)}>
          ${options.map((k) => html`<option value=${k} selected=${k === type}>${L[k]}</option>`)}
        </select>
      <//>
      <${Field} label=${type === 'petitAuBout' ? 'Qui a gagné le petit au dernier pli ?' : type === 'slamFailed' ? 'Qui avait annoncé le chelem ?' : 'Joueur'}>
        <${PlayerSelect} doc=${doc} ids=${type === 'slamFailed' ? E.attackingTeam(deal) : E.activePlayers(deal)} value=${beneficiary} onChange=${setBeneficiary} />
      <//>
      ${type === 'slamUnannounced' ? html`<p class="muted">Si le chelem est fait par un défenseur (chelem infligé au preneur), choisissez ce défenseur : chaque défenseur reçoit 200 points.</p>` : null}
      ${error ? html`<div class="error" role="alert">${error}</div>` : null}
      <div class="row end"><button class="btn" onClick=${onClose}>Annuler</button><button class="btn primary" onClick=${submit}>${ann ? 'Enregistrer' : 'Valider'}</button></div>
    <//>`;
  }

  // ------------------------------ players dialog -----------------------------

  function PlayersDialog({ doc, game, onSubmit, onClose }) {
    const [present, setPresent] = useState(game.present);
    const [newName, setNewName] = useState('');
    const [known, setKnown] = useState('');
    const [after, setAfter] = useState(game.tableOrder[game.tableOrder.length - 1]);
    const [error, setError] = useState('');
    const outsiders = doc.players.filter((p) => !game.tableOrder.includes(p.id));
    const toggle = (id) => setPresent(present.includes(id) ? present.filter((p) => p !== id) : present.concat(id));
    async function submit() {
      const res = await onSubmit({ present, newName: newName.trim(), known, after });
      if (res && res.error) setError(res.error);
    }
    return html`<${Modal} title="Arrivées et départs" onClose=${onClose}>
      <p class="muted">Les joueurs décochés gardent leur colonne et leurs points, mais ne sont plus proposés pour les donnes suivantes.</p>
      <div class="row">${game.tableOrder.map((id) => html`<button class="chip" aria-pressed=${present.includes(id)} onClick=${() => toggle(id)}>${E.playerName(doc, id)}</button>`)}</div>
      <h2>Ajouter un joueur</h2>
      ${outsiders.length ? html`<${Field} label="Joueur déjà connu">
        <select value=${known} onChange=${(e) => setKnown(e.target.value)}><option value="">—</option>${outsiders.map((p) => html`<option value=${p.id}>${p.firstName}</option>`)}</select><//>` : null}
      <${Field} label="Ou nouveau prénom"><input type="text" value=${newName} onInput=${(e) => setNewName(e.target.value)} /><//>
      <${Field} label="Assis après">
        <${PlayerSelect} doc=${doc} ids=${game.tableOrder} value=${after} onChange=${setAfter} />
      <//>
      ${error ? html`<div class="error" role="alert">${error}</div>` : null}
      <div class="row end"><button class="btn" onClick=${onClose}>Annuler</button><button class="btn primary" onClick=${submit}>Enregistrer</button></div>
    <//>`;
  }

  // ------------------------------ rules dialog -------------------------------

  function YesNo({ value, onChange, label }) {
    return html`<input type="checkbox" checked=${value} aria-label=${label} onChange=${(e) => onChange(e.target.checked)} />`;
  }
  const numField = (obj, key, set) => html`<input type="number" inputmode="numeric" min="0" style="width:5em" value=${obj[key]} onInput=${(e) => set(Object.assign({}, obj, { [key]: e.target.value === '' ? NaN : Number(e.target.value) }))} />`;

  // The rule set form, shared by the game creation screen and the in-game dialog.
  // The presets (FFT, old school, custom) are only default values to start from.
  function RulesForm({ rules, setRules, defaults, baseKey, onBase }) {
    const upC = (k, v) => setRules(Object.assign({}, rules, { contracts: Object.assign({}, rules.contracts, { [k]: v }) }));
    const upA = (k, v) => setRules(Object.assign({}, rules, { announcements: Object.assign({}, rules.announcements, { [k]: v }) }));
    return html`<div>
      <${Field} label="Valeurs par défaut de départ">
        <select value=${baseKey} onChange=${(e) => onBase(e.target.value)}>
          ${defaults.map((d) => html`<option value=${d.key} selected=${d.key === baseKey}>${d.name}</option>`)}</select>
      <//>
      <p class="muted">Choisir un jeu recharge ses valeurs ; chaque valeur reste modifiable ci-dessous.</p>
      <div class="grid2">
        <${Field} label="Arrondi à"><select value=${rules.roundTo} onChange=${(e) => setRules(Object.assign({}, rules, { roundTo: Number(e.target.value) }))}>
          ${[1, 5, 10].map((v) => html`<option value=${v} selected=${v === rules.roundTo}>${v}</option>`)}</select><//>
        <${Field} label="Arrondi sur"><select value=${rules.roundOn} onChange=${(e) => setRules(Object.assign({}, rules, { roundOn: e.target.value }))}>
          ${[['pts', 'les points'], ['base', 'la base'], ['total', 'le total']].map(([v, t]) => html`<option value=${v} selected=${v === rules.roundOn}>${t}</option>`)}</select><//>
      </div>
      <h2>Contrats</h2>
      <table class="rules"><thead><tr><th>Contrat</th><th>Actif</th><th>Base</th><th>Coef.</th></tr></thead><tbody>
        ${E.CONTRACT_KEYS.map((k) => html`<tr><td>${L[k]}</td>
          <td><${YesNo} label=${'Actif ' + L[k]} value=${rules.contracts[k].valid} onChange=${(v) => upC(k, Object.assign({}, rules.contracts[k], { valid: v }))} /></td>
          <td>${numField(rules.contracts[k], 'base', (v) => upC(k, v))}</td><td>${numField(rules.contracts[k], 'coef', (v) => upC(k, v))}</td></tr>`)}
        <tr><td>${L.goulasch}</td><td><${YesNo} label="Actif Goulasch" value=${rules.contracts.goulasch.valid} onChange=${(v) => upC('goulasch', Object.assign({}, rules.contracts.goulasch, { valid: v }))} /></td>
          <td colspan="2">${numField(rules.contracts.goulasch, 'amount', (v) => upC('goulasch', v))} fixes</td></tr>
      </tbody></table>
      <h2>Annonces</h2>
      <table class="rules"><thead><tr><th>Annonce</th><th>Actif</th><th>Base</th><th title="Multipliée par le coefficient du contrat">Mult.</th><th title="Partagée entre les deux camps">Part.</th><th title="Chutable : le signe suit le contrat">Chut.</th></tr></thead><tbody>
        ${E.ANNOUNCEMENT_KEYS.map((k) => html`<tr><td>${L[k]}</td>
          <td><${YesNo} label=${'Actif ' + L[k]} value=${rules.announcements[k].valid} onChange=${(v) => upA(k, Object.assign({}, rules.announcements[k], { valid: v }))} /></td>
          <td>${numField(rules.announcements[k], 'base', (v) => upA(k, v))}</td>
          ${['multiplied', 'shared', 'canFail'].map((f) => html`<td><${YesNo} label=${f + ' ' + L[k]} value=${rules.announcements[k][f]} onChange=${(v) => upA(k, Object.assign({}, rules.announcements[k], { [f]: v }))} /></td>`)}</tr>`)}
      </tbody></table>
    </div>`;
  }

  /** Default value sets offered to start from: the presets, plus the rules of the last game when they differ. */
  function ruleDefaults(doc, lastRules) {
    const list = E.presetRules().filter((r) => r.id !== 'custom-2016').map((r) => ({ key: r.id, name: r.name, rules: r }));
    if (lastRules && !list.some((d) => E.sameRules(d.rules, lastRules))) {
      list.unshift({ key: 'last', name: `Règles de la dernière partie (${lastRules.name})`, rules: lastRules });
    }
    return list;
  }

  function RulesDialog({ doc, game, onSubmit, onClose }) {
    const current = E.rulesFor(doc, game);
    const defaults = [{ key: 'current', name: `Règles actuelles (${current.name})`, rules: current }].concat(ruleDefaults(doc, null));
    const [rules, setRules] = useState(clone(current));
    const [baseKey, setBaseKey] = useState('current');
    const [scope, setScope] = useState('following');
    const [error, setError] = useState('');
    const onBase = (key) => { setBaseKey(key); setRules(clone(defaults.find((d) => d.key === key).rules)); };
    async function submit() {
      const res = await onSubmit(rules, scope);
      if (res && res.error) setError(res.error);
    }
    return html`<${Modal} title="Règles de la partie" onClose=${onClose}>
      <${RulesForm} rules=${rules} setRules=${setRules} defaults=${defaults} baseKey=${baseKey} onBase=${onBase} />
      <h2>Appliquer</h2>
      <label class="field"><input type="radio" name="scope" checked=${scope === 'following'} onChange=${() => setScope('following')} /> aux donnes suivantes seulement</label>
      <label class="field"><input type="radio" name="scope" checked=${scope === 'all'} onChange=${() => setScope('all')} /> à toute la partie (recalcul complet)</label>
      ${error ? html`<div class="error" role="alert">${error}</div>` : null}
      <div class="row end"><button class="btn" onClick=${onClose}>Annuler</button><button class="btn primary" onClick=${submit}>Enregistrer</button></div>
    <//>`;
  }

  function DateDialog({ game, onSubmit, onClose }) {
    const [date, setDate] = useState(game.date || '');
    const [error, setError] = useState('');
    async function submit() {
      const res = await onSubmit(date);
      if (res && res.error) setError(res.error);
    }
    return html`<${Modal} title="Date de la partie" onClose=${onClose}>
      <${Field} label="Date"><input type="date" value=${date} onInput=${(e) => setDate(e.target.value)} /><//>
      ${error ? html`<div class="error" role="alert">${error}</div>` : null}
      <div class="row end"><button class="btn" onClick=${onClose}>Annuler</button><button class="btn primary" onClick=${submit}>Enregistrer</button></div>
    <//>`;
  }

  // ------------------------------ change log ---------------------------------

  function LogDialog({ doc, game, onClose }) {
    const entries = (doc.log || []).filter((e) => e.game === game.id).slice().reverse();
    const when = (iso) => new Date(iso).toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
    return html`<${Modal} title="Journal des modifications" onClose=${onClose}>
      ${entries.length ? entries.map((e) => html`<div class="card log-entry">
        <div class="muted">${when(e.at)}${e.by ? ' · ' + e.by : ''}</div>
        ${e.text.map((t) => html`<div>${t}</div>`)}</div>`)
        : html`<p class="muted">Aucune modification enregistrée pour cette partie. Les actions faites avant l’arrivée du journal n’y figurent pas.</p>`}
    <//>`;
  }

  // ------------------------------ score sheet --------------------------------

  function Sheet({ doc, game, readOnly, onRow }) {
    const { rows, totals } = E.recomputeGame(doc, clone(game));
    const ids = game.tableOrder;
    const gaps = E.dealerGaps(game);
    const cell = (row, id) => {
      const d = row.deal;
      if (!d.players.includes(id)) return html`<td class="out"></td>`;
      const v = row.scores[id] || 0;
      const dead = d.dead.includes(id);
      return html`<td class=${dead ? 'dead' : cls(v)}>${dead ? '0' : (d.type === 'passed' ? '' : fmt(v))}<small>${fmt(row.cumulative[id] || 0)}</small></td>`;
    };
    return html`<div class="sheet-wrap"><table class="sheet">
      <thead><tr><th class="label">Donne</th>${ids.map((id) => html`<th class=${game.present.includes(id) ? '' : 'gone'}>${E.playerName(doc, id)}</th>`)}</tr></thead>
      <tbody>${rows.map((row) => html`<tr class=${(row.ann ? 'ann ' : '') + (row.deal.type === 'passed' ? 'passed ' : '') + (row.balanced ? '' : 'bad ') + (readOnly ? '' : 'tap')}
          onClick=${() => !readOnly && onRow(row)} data-deal=${row.deal.number}>
        <td class="label">${row.ann
          ? html`↳ ${L[row.ann.type]} — ${E.playerName(doc, row.ann.beneficiary)}`
          : html`<b>${row.number}.</b> ${dealLabel(doc, row.deal)}<small class="muted" style="display:block">Donneur : ${row.deal.dealer ? E.playerName(doc, row.deal.dealer) : 'inconnu'}</small>`}
          ${row.balanced ? null : html` <span class="neg" title="La somme des scores n’est pas nulle">⚠</span>`}
          ${!row.ann && gaps.includes(row.deal.id) ? html` <span class="warn-mark" title="Donneur inattendu : il manque peut-être une donne, ou un joueur a oublié de distribuer.">⚠</span>` : null}</td>
        ${ids.map((id) => cell(row, id))}</tr>`)}</tbody>
      <tfoot><tr><td class="label">Total</td>${ids.map((id) => html`<td class=${cls(totals[id] || 0)}>${fmt(totals[id] || 0)}</td>`)}</tr></tfoot>
    </table></div>`;
  }

  // ------------------------------ evolution chart ----------------------------

  // Seven distinguishable hues, readable on light and dark backgrounds (one per seat, 7 players at most).
  const SERIES = ['#2a7ab9', '#e07b24', '#2f9e54', '#9a62c8', '#c94c4c', '#8a7a2c', '#13a3b5'];

  function niceStep(range, target) {
    const raw = range / target;
    const pow = Math.pow(10, Math.floor(Math.log10(raw || 1)));
    const f = raw / pow;
    return (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * pow;
  }

  function EvolutionChart({ doc, game }) {
    const data = E.evolution(doc, clone(game));
    const [hidden, setHidden] = useState([]);
    if (data.points.length < 2) return null;
    const W = 360, H = 230, left = 44, right = 10, top = 10, bottom = 24;
    const shown = data.players.filter((id) => !hidden.includes(id));
    const values = [0].concat(...shown.map((id) => data.points.map((pt) => pt.totals[id])));
    let lo = Math.min(...values), hi = Math.max(...values);
    if (lo === hi) { lo -= 10; hi += 10; }
    const step = niceStep(hi - lo, 4);
    lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
    const lastDeal = data.points[data.points.length - 1].deal;
    const x = (deal) => left + ((W - left - right) * deal) / (lastDeal || 1);
    const y = (v) => top + ((H - top - bottom) * (hi - v)) / (hi - lo);
    const yTicks = [];
    for (let v = lo; v <= hi + 1e-9; v += step) yTicks.push(v);
    const xStep = Math.max(1, Math.ceil(lastDeal / 8));
    const xTicks = [];
    for (let d = 0; d <= lastDeal; d += xStep) xTicks.push(d);
    const colorOf = (id) => SERIES[data.players.indexOf(id) % SERIES.length];
    const final = data.points[data.points.length - 1].totals;
    const toggle = (id) => setHidden(hidden.includes(id) ? hidden.filter((h) => h !== id) : hidden.concat(id));
    return html`<details class="card chart-card" open>
      <summary>Évolution des scores</summary>
      <svg viewBox=${`0 0 ${W} ${H}`} role="img" aria-label="Évolution du cumul de chaque joueur, donne après donne" class="chart">
        ${yTicks.map((v) => html`<g><line x1=${left} x2=${W - right} y1=${y(v)} y2=${y(v)} class=${v === 0 ? 'axis zero' : 'axis'} />
          <text x=${left - 5} y=${y(v) + 3} text-anchor="end" class="tick">${pts(v)}</text></g>`)}
        ${xTicks.map((d) => html`<text x=${x(d)} y=${H - 7} text-anchor="middle" class="tick">${d}</text>`)}
        ${shown.map((id) => html`<polyline fill="none" stroke=${colorOf(id)} stroke-width="2" stroke-linejoin="round" stroke-linecap="round"
          points=${data.points.map((pt) => `${x(pt.deal).toFixed(1)},${y(pt.totals[id]).toFixed(1)}`).join(' ')} />`)}
        ${shown.map((id) => html`<circle cx=${x(lastDeal)} cy=${y(final[id])} r="3" fill=${colorOf(id)} />`)}
      </svg>
      <div class="row legend">${data.players.map((id) => html`<button class="chip" aria-pressed=${!hidden.includes(id)} onClick=${() => toggle(id)}
          style=${hidden.includes(id) ? '' : `border-color:${colorOf(id)}`}><span class="dot" style=${`background:${colorOf(id)}`}></span>${E.playerName(doc, id)} <b class=${cls(final[id])}>${fmt(final[id])}</b></button>`)}</div>
    </details>`;
  }

  // ------------------------------ game screen --------------------------------

  function GameScreen({ doc, game, commit, go, history }) {
    const [dialog, setDialog] = useState(null);
    const readOnly = game.state !== 'in_progress';
    const close = () => setDialog(null);
    const withGame = (fn) => (draft) => fn(draft, draft.games.find((g) => g.id === game.id));

    const busy = useRef(false);
    async function run(mutator) {
      if (busy.current) return { error: 'Enregistrement en cours…' }; // ignores a double tap
      busy.current = true;
      try {
        const res = await commit(withGame(mutator), { gameId: game.id });
        if (res.ok) close();
        return res;
      } finally { busy.current = false; }
    }

    const onRow = (row) => setDialog({ kind: 'row', row });
    function rowDialog(row) {
      const d = row.deal;
      const title = row.ann ? `${L[row.ann.type]} — donne ${d.number}` : `Donne ${d.number} — ${dealLabel(doc, d)}`;
      return html`<${Modal} title=${title} onClose=${close}>
        <div class="seg" style="flex-direction:column">
          ${row.ann ? html`
            <button class="btn" onClick=${() => setDialog({ kind: 'annotation', dealId: d.id, ann: row.ann })}>Modifier l’annonce</button>
            <button class="btn danger" onClick=${async () => { if (confirm('Supprimer cette annonce ?')) await run((dr, g) => E.deleteAnnouncement(dr, g, d.id, row.ann.id)); }}>Supprimer l’annonce</button>`
          : html`
            <button class="btn" onClick=${() => setDialog({ kind: 'deal', deal: d })}>Modifier la donne</button>
            ${d.type === 'contract' ? html`<button class="btn" onClick=${() => setDialog({ kind: 'annotation', dealId: d.id })}>Ajouter une annonce</button>` : null}
            <button class="btn" onClick=${() => setDialog({ kind: 'deal', afterDealId: d.id })}>Rajouter une donne après celle-ci</button>
            <button class="btn danger" onClick=${async () => { if (confirm(`Supprimer la donne ${d.number}${d.announcements.length ? ' et ses annonces' : ''} ?`)) await run((dr, g) => E.deleteDeal(dr, g, d.id)); }}>Supprimer la donne</button>`}
        </div><//>`;
    }

    async function submitDeal(dlg, input) {
      if (dlg.deal) {
        const old = dlg.deal;
        const typeChange = (old.type === 'contract') !== (input.type === 'contract');
        if (typeChange && old.announcements.length && !confirm('Changer le type supprime les annonces de cette donne. Continuer ?')) return { error: 'Modification annulée.' };
        return run((dr, g) => E.updateDeal(dr, g, old.id, input));
      }
      if (dlg.afterDealId !== undefined) return run((dr, g) => E.insertDealAfter(dr, g, dlg.afterDealId, input));
      return run((dr, g) => E.addDeal(dr, g, input));
    }

    const lastDealId = game.deals.length ? game.deals[game.deals.length - 1].id : null;
    const dlg = dialog;
    return html`<div>
      <div class="row" style="margin-bottom:10px">
        <div class="grow"><b>${frDate(game.date)}</b> · ${E.rulesFor(doc, game).name}${readOnly ? ' · archivée' : ''}
          <div class="muted">Prochain donneur : ${game.present.length && E.expectedDealer(game) ? E.playerName(doc, E.expectedDealer(game)) : '—'}</div></div>
      </div>
      ${readOnly ? null : html`<div class="row" style="margin-bottom:10px">
        <button class="btn" disabled=${!history.canUndo} onClick=${history.undo} title=${history.canUndo ? 'Annuler : ' + history.lastUndo.texts.join(' ; ') : 'Rien à annuler'}>↶ Annuler</button>
        <button class="btn" disabled=${!history.canRedo} onClick=${history.redo}>↷ Rétablir</button>
        <button class="btn" onClick=${() => setDialog({ kind: 'log' })}>Journal</button>
      </div>
      <div class="row" style="margin-bottom:10px">
        <button class="btn primary" onClick=${() => setDialog({ kind: 'deal' })}>+ Donne</button>
        <button class="btn" onClick=${() => setDialog({ kind: 'annotation' })}>+ Annonce</button>
        <button class="btn" onClick=${() => setDialog({ kind: 'players' })}>Joueurs</button>
        <button class="btn" onClick=${() => setDialog({ kind: 'rules' })}>Règles</button>
      </div>`}
      ${E.dealerGaps(game).length ? html`<div class="warn" role="status">⚠ ${E.dealerGaps(game).length > 1 ? 'Plusieurs donnes ont' : 'Une donne a'} un donneur inattendu (repéré${E.dealerGaps(game).length > 1 ? 'es' : 'e'} par ⚠) : il manque peut-être des donnes, ou un joueur a oublié de distribuer.</div>` : null}
      ${game.deals.length ? html`<${Sheet} doc=${doc} game=${game} readOnly=${readOnly} onRow=${onRow} />`
        : html`<div class="card muted">Aucune donne pour l’instant.</div>`}
      ${game.deals.length ? html`<${EvolutionChart} doc=${doc} game=${game} />` : null}
      ${game.deals.length ? html`<div style="margin-top:12px"><${ExportButtons}
        onCsv=${() => { const t = E.gameTable(doc, clone(game)); downloadCsv(`tarot-partie-${game.date}.csv`, t.header, t.rows); }}
        onExcel=${() => { const t = E.gameTable(doc, clone(game)); return downloadExcel(`tarot-partie-${game.date}.xlsx`, [{ name: 'Partie ' + game.date, header: t.header, rows: t.rows }]); }} /></div>` : null}
      <div class="row end" style="margin-top:14px">
        <button class="btn small" onClick=${() => setDialog({ kind: 'date' })}>Modifier la date</button>
        <button class="btn small danger" onClick=${async () => { if (confirm('Supprimer définitivement cette partie et son journal ?')) { const res = await commit((dr) => E.deleteGame(dr, game.id)); if (res.ok) go('#/'); } }}>Supprimer la partie</button>
      </div>
      ${readOnly ? null : html`<div class="row end" style="margin-top:14px">
        <button class="btn danger" onClick=${async () => { if (confirm('Terminer la partie ? Elle passera dans l’historique.')) { await commit(withGame((dr, g) => E.endGame(g)), { gameId: game.id }); go('#/'); } }}>Terminer la partie</button>
      </div>`}

      ${dlg && dlg.kind === 'row' ? rowDialog(dlg.row) : null}
      ${dlg && dlg.kind === 'deal' ? html`<${DealForm} doc=${doc} game=${game} deal=${dlg.deal} afterDealId=${dlg.afterDealId} onSubmit=${(input) => submitDeal(dlg, input)} onClose=${close} />` : null}
      ${dlg && dlg.kind === 'annotation' ? html`<${AnnouncementForm} doc=${doc} game=${game} dealId=${dlg.dealId} ann=${dlg.ann}
        onSubmit=${(dealId, a) => run((dr, g) => (dlg.ann ? E.updateAnnouncement(dr, g, dealId, dlg.ann.id, a) : E.addAnnouncement(dr, g, dealId, a)))} onClose=${close} />` : null}
      ${dlg && dlg.kind === 'players' ? html`<${PlayersDialog} doc=${doc} game=${game} onClose=${close}
        onSubmit=${({ present, newName, known, after }) => run((dr, g) => {
          let toAdd = null;
          if (newName) toAdd = E.findOrAddPlayer(dr, newName).id; else if (known) toAdd = known;
          const keep = present.filter((p) => g.tableOrder.includes(p));
          if (toAdd) E.addPlayerToTable(g, toAdd, after);
          E.setPresentPlayers(g, toAdd ? Array.from(new Set(keep.concat(toAdd))) : keep);
        })} />` : null}
      ${dlg && dlg.kind === 'date' ? html`<${DateDialog} game=${game} onClose=${close} onSubmit=${(date) => run((dr, g) => E.setGameDate(g, date))} />` : null}
      ${dlg && dlg.kind === 'log' ? html`<${LogDialog} doc=${doc} game=${game} onClose=${close} />` : null}
      ${dlg && dlg.kind === 'rules' ? html`<${RulesDialog} doc=${doc} game=${game} onClose=${close}
        onSubmit=${(rules, scope) => {
          if (JSON.stringify(Object.assign({}, rules, { id: null })) === JSON.stringify(Object.assign({}, E.rulesFor(doc, game), { id: null }))) return { error: 'Aucune modification.' };
          return run((dr, g) => E.changeRules(dr, g, rules, scope));
        }} />` : null}
    </div>`;
  }

  // ------------------------------ new game -----------------------------------

  function NewGame({ doc, commit, go }) {
    const last = doc.games.length ? doc.games[doc.games.length - 1] : null;
    const lastRules = last && doc.rules.find((r) => r.id === last.rulesId);
    const defaults = ruleDefaults(doc, lastRules);
    const initial = (lastRules && defaults.find((d) => E.sameRules(d.rules, lastRules))) || defaults.find((d) => d.key === 'custom');
    const [date, setDate] = useState(today());
    const [baseKey, setBaseKey] = useState(initial.key);
    const [rules, setRules] = useState(clone(initial.rules));
    const onBase = (key) => { setBaseKey(key); setRules(clone(defaults.find((d) => d.key === key).rules)); };
    const base = defaults.find((d) => d.key === baseKey);
    const modified = !E.sameRules(base.rules, rules);
    const [selected, setSelected] = useState([]);
    const [newName, setNewName] = useState('');
    const [error, setError] = useState('');
    const [extra, setExtra] = useState([]); // players created in this screen (not saved until the game is)
    const known = doc.players.concat(extra).slice().sort((a, b) => a.firstName.localeCompare(b.firstName, 'fr'));
    const nameOf = (id) => (known.find((p) => p.id === id) || {}).firstName;
    const toggle = (id) => setSelected(selected.includes(id) ? selected.filter((p) => p !== id) : selected.concat(id));
    const move = (i, d) => { const s = selected.slice(); const j = i + d; if (j < 0 || j >= s.length) return; [s[i], s[j]] = [s[j], s[i]]; setSelected(s); };
    function addNew() {
      const name = newName.trim();
      if (!name) return;
      const existing = known.find((p) => p.firstName.toLowerCase() === name.toLowerCase());
      if (existing) { if (!selected.includes(existing.id)) setSelected(selected.concat(existing.id)); }
      else { const p = { id: E.newId(), firstName: name }; setExtra(extra.concat(p)); setSelected(selected.concat(p.id)); }
      setNewName('');
    }
    async function create() {
      const inProgress = E.currentGame(doc);
      if (inProgress && !confirm('La partie en cours sera archivée. Continuer ?')) return;
      const res = await commit((dr) => {
        const ids = selected.map((id) => {
          const p = known.find((x) => x.id === id);
          if (!dr.players.some((x) => x.id === id)) dr.players.push({ id: p.id, firstName: p.firstName });
          return id;
        });
        return E.createGame(dr, { date, rules, playerIds: ids }).id;
      });
      if (res.error) setError(res.error); else go('#/game/' + res.result);
    }
    return html`<div>
      <h2>Nouvelle partie</h2>
      <${Field} label="Date"><input type="date" value=${date} onInput=${(e) => setDate(e.target.value)} /><//>
      <details class="card rules-card">
        <summary>Règles : <b>${base.name}</b>${modified ? ' — modifiées' : ''}</summary>
        <${RulesForm} rules=${rules} setRules=${setRules} defaults=${defaults} baseKey=${baseKey} onBase=${onBase} />
      </details>
      <h2>Joueurs (${selected.length}) — dans l’ordre de la table</h2>
      ${selected.length ? html`<div class="card">${selected.map((id, i) => html`<div class="row" style="padding:3px 0">
        <b>${i + 1}.</b><span class="grow">${nameOf(id)}</span>
        <button class="btn small" aria-label="Monter" onClick=${() => move(i, -1)}>↑</button>
        <button class="btn small" aria-label="Descendre" onClick=${() => move(i, 1)}>↓</button>
        <button class="btn small" aria-label="Retirer" onClick=${() => toggle(id)}>✕</button></div>`)}</div>` : null}
      <div class="row">${known.filter((p) => !selected.includes(p.id)).map((p) => html`<button class="chip" aria-pressed="false" onClick=${() => toggle(p.id)}>+ ${p.firstName}</button>`)}</div>
      <div class="row" style="margin-top:10px">
        <input type="text" class="grow" placeholder="Nouveau prénom" value=${newName} onInput=${(e) => setNewName(e.target.value)} onKeyDown=${(e) => { if (e.key === 'Enter') addNew(); }} style="width:auto" />
        <button class="btn" onClick=${addNew}>Ajouter</button>
      </div>
      ${error ? html`<div class="error" role="alert">${error}</div>` : null}
      <div class="row end" style="margin-top:14px">
        <button class="btn" onClick=${() => go('#/')}>Annuler</button>
        <button class="btn primary" disabled=${selected.length < E.MIN_PLAYERS || selected.length > E.MAX_PLAYERS} onClick=${create}>Créer la partie</button>
      </div>
      ${selected.length < E.MIN_PLAYERS ? html`<p class="muted">Choisissez de 3 à 7 joueurs.</p>` : null}
    </div>`;
  }

  // ------------------------------ statistics ---------------------------------

  const nf = (digits) => (x) => (x === null || x === undefined ? '—' : x.toLocaleString('fr-FR', { minimumFractionDigits: digits, maximumFractionDigits: digits }));
  const n1 = nf(1);
  const pct = (x) => (x === null || x === undefined ? '—' : (100 * x).toLocaleString('fr-FR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + ' %');
  const pts = (x) => (x < 0 ? '\u2212' : '') + Math.abs(x).toLocaleString('fr-FR');
  const signed = (x) => (x === null || x === undefined ? '—' : (x < 0 ? '−' : '') + n1(Math.abs(x)));

  function StatBlock({ title, children }) {
    return html`<section class="card"><h2 style="margin-top:0">${title}</h2>${children}</section>`;
  }

  /** Detail of one player (or of the whole table when id === 'total'). */
  function PlayerStats({ doc, st, id, onClose }) {
    const isTotal = id === 'total';
    const p = isTotal ? st.total : st.players[id];
    const name = isTotal ? 'Total général' : E.playerName(doc, id);
    const contracts = E.CONTRACT_KEYS.filter((k) => p.takes.byContract[k]);
    const announcements = E.ANNOUNCEMENT_KEYS.filter((k) => p.announcements.byType[k]);
    const partnerIds = Object.keys(p.partners).sort((a, b) => p.partners[b] - p.partners[a]);
    return html`<${Modal} title=${name} onClose=${onClose}>
      ${!isTotal && !p.reliable ? html`<div class="warn">⚠ Moins de 10 parties : les moyennes sont peu fiables.</div>` : null}
      <${StatBlock} title="Parties et donnes">
        <table class="stat"><tbody>
          <tr><td>Parties jouées</td><td>${p.games}${isTotal ? '' : html` <span class="muted">(${pct(p.participation)} des parties)</span>`}</td></tr>
          <tr><td>Donnes jouées</td><td>${p.deals}${isTotal ? '' : html` <span class="muted">(${pct(p.dealShare)} des donnes)</span>`}</td></tr>
          <tr><td>Donnes par partie</td><td>${n1(p.avgDealsPerGame)}</td></tr>
        </tbody></table>
      <//>
      <${StatBlock} title="Points">
        <table class="stat"><tbody>
          <tr><td>Total</td><td class=${cls(p.points)}>${pts(p.points)}</td></tr>
          <tr><td>Moyenne par partie</td><td class=${cls(p.avgPointsPerGame)}>${signed(p.avgPointsPerGame)}</td></tr>
          ${isTotal ? null : html`<tr><td>Victoires</td><td>${p.wins}</td></tr><tr><td>Dernières places</td><td>${p.lasts}</td></tr>`}
        </tbody></table>
      <//>
      <${StatBlock} title="Prises">
        ${contracts.length ? html`<div class="sheet-wrap"><table class="stat wide"><thead><tr><th>Contrat</th><th>Nb</th><th>%</th><th>Réuss.</th><th>Taux</th><th>Écart</th></tr></thead><tbody>
          ${contracts.map((k) => { const b = p.takes.byContract[k]; return html`<tr><td>${L[k]}</td><td>${b.count}</td><td>${pct(b.share)}</td><td>${b.succeeded}</td><td>${pct(b.rate)}</td><td>${n1(b.avgDiff)}</td></tr>`; })}
          <tr class="sum"><td>Total</td><td>${p.takes.count}</td><td>${pct(1)}</td><td>${p.takes.succeeded}</td><td>${pct(p.takes.rate)}</td><td>${n1(p.takes.avgDiff)}</td></tr>
        </tbody></table></div>
        <p class="muted">% : répartition des prises · Écart : écart de points moyen</p>` : html`<div class="muted">Aucune prise.</div>`}
      <//>
      <${StatBlock} title="Annonces">
        ${announcements.length ? html`<table class="stat wide"><thead><tr><th>Annonce</th><th>Nb</th><th>%</th></tr></thead><tbody>
          ${announcements.map((k) => html`<tr><td>${L[k]}</td><td>${p.announcements.byType[k]}</td><td>${pct(p.announcements.shares[k])}</td></tr>`)}
          <tr class="sum"><td>Total</td><td>${p.announcements.count}</td><td>${pct(1)}</td></tr>
        </tbody></table>
        <p class="muted">${n1(p.announcements.per10Deals)} pour 10 donnes · ${n1(p.announcements.perGame)} par partie</p>` : html`<div class="muted">Aucune annonce.</div>`}
      <//>
      <${StatBlock} title="Partenaires">
        <table class="stat"><tbody>
          <tr><td>Auto-appels</td><td>${p.takes.selfCalls}${html` <span class="muted">(${pct(p.takes.selfCallShare)} des prises)</span>`}</td></tr>
          ${isTotal ? null : html`<tr><td>Appelé par un preneur</td><td>${p.calledCount} fois</td></tr>`}
        </tbody></table>
        ${partnerIds.length ? html`<p class="muted" style="margin-bottom:4px">Partenaires appelés${isTotal ? '' : ' par ce joueur'} :</p>
          <div class="row">${partnerIds.map((pid) => html`<span class="chip static">${E.playerName(doc, pid)} · ${p.partners[pid]}</span>`)}</div>` : null}
      <//>
      ${p.goulasch.won || p.goulasch.lost ? html`<${StatBlock} title="Goulasch">
        <table class="stat"><tbody>
          <tr><td>Gagnés</td><td>${p.goulasch.won}</td></tr>
          ${isTotal ? null : html`<tr><td>Perdus</td><td>${p.goulasch.lost}</td></tr><tr><td>Solde</td><td class=${cls(p.goulasch.balance)}>${pts(p.goulasch.balance)}</td></tr>`}
        </tbody></table>
      <//>` : null}
    <//>`;
  }

  function StatsScreen({ doc }) {
    const years = Array.from(new Set(doc.games.map((g) => (g.date || '').slice(0, 4)).filter(Boolean))).sort().reverse();
    const [period, setPeriod] = useState('all');
    const [from, setFrom] = useState('');
    const [to, setTo] = useState('');
    const [sort, setSort] = useState('avg');
    const [detail, setDetail] = useState(null);
    let range = {};
    if (/^\d{4}$/.test(period)) range = { from: period + '-01-01', to: period + '-12-31' };
    else if (period === 'custom') range = { from: from || null, to: to || null };
    const st = E.computeStats(doc, range);
    const periodName = period === 'all' ? 'toutes-les-parties' : period === 'custom' ? `${from || 'debut'}_${to || 'fin'}` : period;
    const keyOf = {
      avg: (p) => (p.avgPointsPerGame === null ? -Infinity : p.avgPointsPerGame), total: (p) => p.points, wins: (p) => p.wins,
      games: (p) => p.games, deals: (p) => p.deals,
    }[sort];
    const ids = Object.keys(st.players).filter((id) => st.players[id].games > 0)
      .sort((a, b) => keyOf(st.players[b]) - keyOf(st.players[a]) || E.playerName(doc, a).localeCompare(E.playerName(doc, b), 'fr'));
    const lowGames = ids.some((id) => !st.players[id].reliable);
    return html`<div>
      <div class="grid2">
        <${Field} label="Période"><select value=${period} onChange=${(e) => setPeriod(e.target.value)}>
          <option value="all">Toutes les parties</option>
          ${years.map((y) => html`<option value=${y} selected=${y === period}>${y}</option>`)}
          <option value="custom">Dates précises…</option></select><//>
        <${Field} label="Trier par"><select value=${sort} onChange=${(e) => setSort(e.target.value)}>
          ${[['avg', 'Moyenne par partie'], ['total', 'Total des points'], ['wins', 'Victoires'], ['games', 'Parties jouées'], ['deals', 'Donnes jouées']].map(([v, t]) => html`<option value=${v} selected=${v === sort}>${t}</option>`)}</select><//>
      </div>
      ${period === 'custom' ? html`<div class="grid2">
        <${Field} label="Du"><input type="date" value=${from} onInput=${(e) => setFrom(e.target.value)} /><//>
        <${Field} label="Au"><input type="date" value=${to} onInput=${(e) => setTo(e.target.value)} /><//>
      </div>` : null}
      ${st.games === 0 ? html`<div class="card muted">Aucune partie sur cette période.</div>` : html`
        <div class="card">
          <b>${st.games}</b> partie${st.games > 1 ? 's' : ''} · <b>${st.deals}</b> donnes · <b>${st.total.takes.count}</b> prises
          · réussite <b>${pct(st.total.takes.rate)}</b>
        </div>
        <div class="sheet-wrap"><table class="sheet stats-table">
          <thead><tr><th class="label">Joueur</th><th>Points</th><th>Moy.</th><th>Vict.</th><th>Dern.</th></tr></thead>
          <tbody>${ids.map((id) => { const p = st.players[id]; return html`<tr class="tap" onClick=${() => setDetail(id)} data-player=${E.playerName(doc, id)}>
            <td class="label"><b>${E.playerName(doc, id)}</b>${p.reliable ? '' : html` <span class="warn-mark" title="Moins de 10 parties : moyenne peu fiable">⚠</span>`}
              <small class="muted" style="display:block">${p.games} partie${p.games > 1 ? 's' : ''}</small></td>
            <td class=${cls(p.points)}>${pts(p.points)}</td><td class=${cls(p.avgPointsPerGame)}>${signed(p.avgPointsPerGame)}</td>
            <td>${p.wins}</td><td>${p.lasts}</td></tr>`; })}</tbody>
          <tfoot><tr class="tap" onClick=${() => setDetail('total')}><td class="label">Total général<small class="muted" style="display:block">${st.games} partie${st.games > 1 ? 's' : ''}</small></td><td></td><td></td><td></td><td></td></tr></tfoot>
        </table></div>
        <${ExportButtons} hint="CSV : le classement. Excel : classement, prises, annonces et partenaires."
          onCsv=${() => { const t = E.statsTables(doc, st)[0]; downloadCsv(`tarot-statistiques-${periodName}.csv`, t.header, t.rows); }}
          onExcel=${() => downloadExcel(`tarot-statistiques-${periodName}.xlsx`, E.statsTables(doc, st))} />
        ${lowGames ? html`<p class="muted">⚠ Moins de 10 parties : la moyenne par partie est peu fiable.</p>` : null}
        <p class="muted">Touchez un joueur pour voir le détail (prises, annonces, partenaires). Les tours passés ne comptent pas comme donnes jouées ; le Goulasch compte comme une donne, mais pas comme une prise.</p>`}
      ${detail && st.games ? html`<${PlayerStats} doc=${doc} st=${st} id=${detail} onClose=${() => setDetail(null)} />` : null}
    </div>`;
  }

  // ------------------------------ home ---------------------------------------

  function Home({ doc, commit, go, replaceDoc }) {
    const current = E.currentGame(doc);
    const archived = doc.games.filter((g) => g.state !== 'in_progress').slice().reverse().sort((a, b) => (b.date || '').localeCompare(a.date || ''));
    const names = (g) => g.tableOrder.map((id) => E.playerName(doc, id)).join(', ');
    const fileRef = useRef(null);
    const [message, setMessage] = useState('');
    function exportJson() {
      download(`tarot-${today()}.json`, JSON.stringify(doc, null, 1));
    }
    async function importJson(e) {
      const file = e.target.files[0];
      e.target.value = '';
      if (!file) return;
      try {
        const next = E.migrate(JSON.parse(await file.text()));
        if (!confirm(`Remplacer toutes les données actuelles par ce fichier (${next.games.length} parties) ?`)) return;
        const res = await replaceDoc(next);
        setMessage(res.error ? res.error : 'Données importées.');
      } catch (err) { setMessage('Import impossible : ' + err.message); }
    }
    return html`<div>
      ${current ? html`<h2>Partie en cours</h2>
        <div class="card link" onClick=${() => go('#/game/' + current.id)}>
          <b>${frDate(current.date)}</b> · ${current.deals.length} donne${current.deals.length > 1 ? 's' : ''}
          <div class="muted">${names(current)}</div></div>` : null}
      <div class="row"><button class="btn primary" onClick=${() => go('#/new')}>Nouvelle partie</button>
        <button class="btn" onClick=${() => go('#/stats')}>Statistiques</button></div>
      <h2>Historique</h2>
      ${archived.length ? archived.map((g) => {
        const ranking = g.deals.length ? E.ranking(doc, clone(g)) : [];
        return html`<div class="card link" onClick=${() => go('#/game/' + g.id)}>
          <b>${frDate(g.date)}</b> · ${g.deals.length} donne${g.deals.length > 1 ? 's' : ''}
          ${ranking.length ? html`<div class="ranking">${ranking.map((r, i) => html`<span class="rank"><span class="muted">${i + 1}.</span> ${i === 0 ? '🏆 ' : ''}${E.playerName(doc, r.playerId)} <b class=${cls(r.total)}>${fmt(r.total)}</b></span>`)}</div>`
            : html`<div class="muted">${names(g)}</div>`}</div>`;
      }) : html`<div class="muted">Aucune partie archivée.</div>`}
      <h2>Données</h2>
      <div class="row">
        <button class="btn" onClick=${exportJson}>Exporter (JSON)</button>
        <button class="btn" onClick=${() => fileRef.current.click()}>Importer (JSON)</button>
        <input ref=${fileRef} type="file" accept="application/json,.json" hidden onChange=${importJson} />
      </div>
      <p class="muted">Sauvegardez régulièrement : les données sont stockées dans ce navigateur uniquement.</p>
      ${message ? html`<div class="info" role="status">${message}</div>` : null}
    </div>`;
  }

  // ------------------------------ app ----------------------------------------

  function App() {
    const [doc, setDoc] = useState(null);
    const [route, setRoute] = useState(location.hash || '#/');
    const [fatal, setFatal] = useState('');
    const docRef = useRef(null);

    useEffect(() => {
      const onHash = () => setRoute(location.hash || '#/');
      window.addEventListener('hashchange', onHash);
      (async () => {
        try {
          let stored = await idb.get('doc');
          stored = stored ? E.migrate(stored) : E.createDocument();
          docRef.current = stored;
          setDoc(stored);
          if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
        } catch (e) { setFatal('Impossible d’ouvrir les données locales : ' + e.message); }
      })();
      return () => window.removeEventListener('hashchange', onHash);
    }, []);

    // Undo / redo (in memory, last 30 actions) and the change log (kept in the document).
    const [undoStack, setUndoStack] = useState([]);
    const [redoStack, setRedoStack] = useState([]);
    const MAX_UNDO = 30;

    // Applies a mutation on a copy, saves it, and only then shows it: a failure never leaves a half-updated state.
    // meta.gameId: the action edits that game -> it is written to the change log and can be undone.
    async function commit(mutator, meta) {
      const prev = docRef.current;
      const next = clone(prev);
      let result;
      try { result = mutator(next); } catch (e) { return { error: e.message }; }
      let entry = null;
      if (meta && meta.gameId) {
        const before = prev.games.find((g) => g.id === meta.gameId);
        const after = next.games.find((g) => g.id === meta.gameId);
        if (before && after) {
          const texts = E.describeChange(next, before, after);
          if (texts.length) {
            next.log.push({ id: E.newId(), at: new Date().toISOString(), game: meta.gameId, by: null, text: texts });
            entry = { gameId: meta.gameId, before: clone(before), after: clone(after), texts };
          }
        }
      }
      next.rev = (next.rev || 0) + 1;
      next.updatedAt = new Date().toISOString();
      try { await idb.put('doc', next); } catch (e) { return { error: 'Sauvegarde impossible : ' + e.message }; }
      docRef.current = next;
      setDoc(next);
      if (entry) { setUndoStack((st) => st.concat(entry).slice(-MAX_UNDO)); setRedoStack([]); }
      return { ok: true, result };
    }
    // Puts a game back to a recorded state (undo: `before`, redo: `after`) and logs it.
    async function restore(entry, which) {
      const next = clone(docRef.current);
      const i = next.games.findIndex((g) => g.id === entry.gameId);
      if (i < 0) return { error: 'Partie introuvable.' };
      next.games[i] = clone(which === 'undo' ? entry.before : entry.after);
      const text = (which === 'undo' ? 'Annulation : ' : 'Rétablissement : ') + entry.texts.join(' ; ');
      next.log.push({ id: E.newId(), at: new Date().toISOString(), game: entry.gameId, by: null, text: [text] });
      next.rev = (next.rev || 0) + 1;
      next.updatedAt = new Date().toISOString();
      try { await idb.put('doc', next); } catch (e) { return { error: 'Sauvegarde impossible : ' + e.message }; }
      docRef.current = next;
      setDoc(next);
      return { ok: true };
    }
    async function undo() {
      const entry = undoStack[undoStack.length - 1];
      if (!entry) return;
      const res = await restore(entry, 'undo');
      if (res.ok) { setUndoStack(undoStack.slice(0, -1)); setRedoStack(redoStack.concat(entry)); }
    }
    async function redo() {
      const entry = redoStack[redoStack.length - 1];
      if (!entry) return;
      const res = await restore(entry, 'redo');
      if (res.ok) { setRedoStack(redoStack.slice(0, -1)); setUndoStack(undoStack.concat(entry).slice(-MAX_UNDO)); }
    }
    async function replaceDoc(next) {
      setUndoStack([]); setRedoStack([]);
      const copy = clone(next);
      copy.rev = (docRef.current.rev || 0) + 1;
      copy.updatedAt = new Date().toISOString();
      try { await idb.put('doc', copy); } catch (e) { return { error: 'Sauvegarde impossible : ' + e.message }; }
      docRef.current = copy;
      setDoc(copy);
      return { ok: true };
    }
    const go = (hash) => { if (location.hash === hash) setRoute(hash); else location.hash = hash; };

    if (fatal) return html`<main><div class="error">${fatal}</div></main>`;
    if (!doc) return html`<main class="muted">Chargement…</main>`;

    const m = route.match(/^#\/game\/(.+)$/);
    let body;
    let title = 'Tarot';
    if (m) {
      const game = doc.games.find((g) => g.id === m[1]);
      if (game) { body = html`<${GameScreen} key=${game.id} doc=${doc} game=${game} commit=${commit} go=${go}
        history=${{ canUndo: undoStack.some((e) => e.gameId === game.id) && undoStack[undoStack.length - 1].gameId === game.id, canRedo: redoStack.length > 0 && redoStack[redoStack.length - 1].gameId === game.id, undo, redo, lastUndo: undoStack.length ? undoStack[undoStack.length - 1] : null }} />`; title = 'Partie du ' + frDate(game.date); }
      else body = html`<div class="error">Partie introuvable.</div>`;
    } else if (route === '#/new') { body = html`<${NewGame} doc=${doc} commit=${commit} go=${go} />`; title = 'Nouvelle partie'; }
    else if (route === '#/stats') { body = html`<${StatsScreen} doc=${doc} />`; title = 'Statistiques'; }
    else body = html`<${Home} doc=${doc} commit=${commit} go=${go} replaceDoc=${replaceDoc} />`;

    return html`<header class="top">
        ${route === '#/' || route === '' ? null : html`<button class="btn small" onClick=${() => go('#/')} aria-label="Accueil">←</button>`}
        <h1>${title}</h1>
      </header>
      <main>${body}<div class="footer">Version ${BUILD}</div></main>`;
  }

  render(html`<${App} />`, document.getElementById('root'));
}());
</script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch((err) => console.warn('Service worker registration failed', err));
  }
</script>
</body>
</html>
